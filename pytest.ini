[pytest]
asyncio_mode = auto
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    archive
    EXCLUDE
    venv
markers =
    baseline: Tests that work without API keys
    full: Tests that require free-tier API keys
    browser: Playwright browser UI tests
    slow: Tests that take more than 30 seconds
addopts =
    --ignore=archive
    --ignore=EXCLUDE
