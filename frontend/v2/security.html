<!DOCTYPE html>
<html lang="en" data-theme="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security - ABCT V2</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.ico">
    <link rel="stylesheet" href="/next/static/css/v2.css">
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <script src="/static/js/session-auth.js?v=1782655285"></script>
</head>
<body>
    <div class="v2-layout" id="v2Layout">
        <nav class="v2-sidebar" id="v2Sidebar"></nav>
        <main class="v2-main">
            <header class="v2-topbar">
                <div class="v2-topbar-left"><span class="v2-topbar-title">Security & Privacy</span></div>
                <div class="v2-topbar-right"><div class="v2-user-menu"></div></div>
            </header>

            <div class="v2-content">
                <!-- Privacy Summary -->
                <div class="v2-stats-grid v2-fade-in" style="margin-bottom:24px">
                    <div class="v2-stat-card"><div class="v2-stat-label">Privacy Score</div><div class="v2-stat-value" id="privacyScore"><span class="v2-skeleton v2-skeleton-value"></span></div></div>
                    <div class="v2-stat-card"><div class="v2-stat-label">Token Approvals</div><div class="v2-stat-value" id="approvalCount"><span class="v2-skeleton v2-skeleton-value"></span></div></div>
                    <div class="v2-stat-card"><div class="v2-stat-label">Spam Tokens</div><div class="v2-stat-value" id="spamCount"><span class="v2-skeleton v2-skeleton-value"></span></div></div>
                    <div class="v2-stat-card"><div class="v2-stat-label">Threat Alerts</div><div class="v2-stat-value" id="threatCount"><span class="v2-skeleton v2-skeleton-value"></span></div></div>
                </div>

                <!-- Security Actions -->
                <div class="v2-card v2-fade-in" style="margin-bottom:24px">
                    <div class="v2-card-header"><span class="v2-card-title">Security Scans</span></div>
                    <div style="display:flex;gap:12px;flex-wrap:wrap;">
                        <button class="v2-btn v2-btn-secondary" id="scanPoisoningBtn">Scan for Address Poisoning</button>
                        <button class="v2-btn v2-btn-secondary" id="scanSpamBtn">Detect Spam Tokens</button>
                        <button class="v2-btn v2-btn-secondary" id="scanCardanoShieldBtn">Cardano Shield Check</button>
                        <button class="v2-btn v2-btn-secondary" id="checkApprovalsBtn">Check Token Approvals</button>
                    </div>
                </div>

                <!-- Wallet Privacy Scores -->
                <div class="v2-card v2-fade-in">
                    <div class="v2-card-header"><span class="v2-card-title">Wallet Privacy Analysis</span></div>
                    <div id="privacyWallets">
                        <div class="v2-skeleton v2-skeleton-chart" style="height:200px;"></div>
                    </div>
                </div>
            </div>

            <footer class="v2-footer">ABCT V2 | Security</footer>
        </main>
    </div>

    <script src="/next/static/js/v2-cache.js"></script>
    <script src="/next/static/js/v2-app.js"></script>
    <script src="/next/static/js/v2-shell.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            v2InitShell('security');
            loadSecurity();

            // Attach button handlers (avoid inline onclick)
            document.getElementById('scanPoisoningBtn').addEventListener('click', scanPoisoning);
            document.getElementById('scanSpamBtn').addEventListener('click', scanSpam);
            document.getElementById('scanCardanoShieldBtn').addEventListener('click', scanCardanoShield);
            document.getElementById('checkApprovalsBtn').addEventListener('click', checkApprovals);
        });

        async function loadSecurity() {
            // Fire all security requests in parallel (was sequential)
            var useCached = typeof v2CachedFetch === 'function';

            var results = await Promise.allSettled([
                useCached ? v2CachedFetch('/spam/status') : v2Fetch('/spam/status').then(function(r) { return r.ok ? r.json().then(function(d) { return { data: d }; }) : { data: null }; }),
                useCached ? v2CachedFetch('/privacy/approvals/wallets') : v2Fetch('/privacy/approvals/wallets').then(function(r) { return r.ok ? r.json().then(function(d) { return { data: d }; }) : { data: null }; }),
                useCached ? v2CachedFetch('/privacy/wallets/summary') : v2Fetch('/privacy/wallets/summary').then(function(r) { return r.ok ? r.json().then(function(d) { return { data: d }; }) : { data: null }; }),
            ]);

            // Spam count
            if (results[0].status === 'fulfilled' && results[0].value && results[0].value.data) {
                var spamData = results[0].value.data;
                setText('spamCount', (spamData.hidden_tokens_count || 0).toLocaleString());
            }

            // Approval count
            if (results[1].status === 'fulfilled' && results[1].value && results[1].value.data) {
                var approvalData = results[1].value.data;
                setText('approvalCount', (approvalData.total || 0).toLocaleString());
            }

            // Threat count — no direct endpoint; default to '--'
            setText('threatCount', '--');

            // Privacy score — derive from wallet summary scores
            setText('privacyScore', '--');

            // Wallet privacy summary
            if (results[2].status === 'fulfilled' && results[2].value && results[2].value.data) {
                var privacyData = results[2].value.data;
                renderPrivacyWallets(privacyData);

                // Compute average privacy score from wallets that have one
                var walletsList = privacyData.wallets || [];
                var scored = walletsList.filter(function(w) { return w.static_privacy_score !== null; });
                if (scored.length > 0) {
                    var avg = scored.reduce(function(s, w) { return s + w.static_privacy_score; }, 0) / scored.length;
                    setText('privacyScore', Math.round(avg) + '/100');
                }
            } else {
                setSafeHTML(document.getElementById('privacyWallets'), '<div style="padding:20px;color:var(--v2-text-muted);text-align:center">Privacy analysis available after scanning</div>');
            }
        }

        function renderPrivacyWallets(data) {
            const container = document.getElementById('privacyWallets');
            const wallets = data.wallets || data || [];

            if (!wallets.length) {
                setSafeHTML(container, '<div style="padding:20px;color:var(--v2-text-muted);text-align:center">No privacy-relevant wallets found. Add ZCash, Monero, or EVM wallets to see privacy scores.</div>');
                return;
            }

            let html = '<table class="v2-table"><thead><tr><th>Wallet</th><th>Chain</th><th class="right">Score</th><th>Level</th></tr></thead><tbody>';
            wallets.forEach(w => {
                // Backend field: static_privacy_score (null means needs on-demand scan)
                const score = w.static_privacy_score;
                const hasScore = score !== null && score !== undefined;
                const scoreNum = hasScore ? score : 0;
                const level = !hasScore ? 'Scan Required' : scoreNum >= 80 ? 'High' : scoreNum >= 50 ? 'Medium' : 'Low';
                const levelClass = !hasScore ? 'v2-badge-neutral' : scoreNum >= 80 ? 'v2-badge-green' : scoreNum >= 50 ? 'v2-badge-neutral' : 'v2-badge-red';
                const addr = w.address || '';
                const shortAddr = addr.length > 16 ? addr.slice(0,8) + '...' + addr.slice(-6) : addr;
                const label = w.label ? escapeHtml(w.label) + ' ' : '';

                html += `<tr>
                    <td style="font-family:monospace;font-size:12px">${label}<span style="opacity:0.7">${escapeHtml(shortAddr)}</span></td>
                    <td><span class="v2-chain-badge chain-${escapeAttr((w.blockchain || '').toLowerCase())}">${escapeHtml(w.blockchain || '')}</span></td>
                    <td class="right"><strong>${hasScore ? score + '/100' : '--'}</strong></td>
                    <td><span class="v2-badge ${levelClass}">${level}</span></td>
                </tr>`;
            });
            html += '</tbody></table>';
            setSafeHTML(container, html);
        }

        async function scanPoisoning() {
            showToast('Scanning for address poisoning...', 'success');
            try {
                await v2Fetch('/privacy/scan-poisoning', { method: 'POST' });
                showToast('Poisoning scan complete', 'success');
                loadSecurity();
            } catch(e) { showToast('Scan failed', 'error'); }
        }

        async function scanSpam() {
            showToast('Detecting spam tokens...', 'success');
            try {
                await v2Fetch('/spam/scan');
                showToast('Spam scan complete', 'success');
                loadSecurity();
            } catch(e) { showToast('Scan failed', 'error'); }
        }

        async function scanCardanoShield() {
            showToast('Running Cardano Shield check...', 'success');
            try {
                await v2Fetch('/privacy/scan-cardano-shield', { method: 'POST' });
                showToast('Shield check complete', 'success');
                loadSecurity();
            } catch(e) { showToast('Check failed', 'error'); }
        }

        async function checkApprovals() {
            showToast('Checking token approvals...', 'success');
            try {
                const resp = await v2Fetch('/privacy/approvals/wallets');
                if (resp.ok) {
                    const data = await resp.json();
                    // Backend returns: {wallets: [...], total: N} — total is wallet count, not approval count
                    // Each wallet needs individual /privacy/approvals/wallet/{id} call for approval details
                    const walletCount = data.total || (data.wallets || []).length;
                    setText('approvalCount', walletCount.toLocaleString() + ' wallets');
                    showToast(`Found ${walletCount} EVM wallets for approval checks`, 'success');
                }
            } catch(e) { showToast('Check failed', 'error'); }
        }
    </script>
</body>
</html>
