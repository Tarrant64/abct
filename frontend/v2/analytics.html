<!DOCTYPE html>
<html lang="en" data-theme="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - ABCT V2</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.ico">
    <link rel="stylesheet" href="/next/static/css/v2.css">
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <script src="/static/js/session-auth.js?v=1772669294"></script>
</head>
<body>
    <div class="v2-layout" id="v2Layout">
        <nav class="v2-sidebar" id="v2Sidebar"></nav>
        <main class="v2-main">
            <header class="v2-topbar">
                <div class="v2-topbar-left"><span class="v2-topbar-title">Analytics</span></div>
                <div class="v2-topbar-right"><div class="v2-user-menu"></div></div>
            </header>

            <div class="v2-content">
                <!-- Market Summary -->
                <div class="v2-card v2-fade-in" style="margin-bottom:24px">
                    <div class="v2-card-header">
                        <span class="v2-card-title">Global Market</span>
                    </div>
                    <div class="v2-stats-grid" id="marketStats" style="margin-bottom:0">
                        <div class="v2-stat-card">
                            <div class="v2-stat-label">Total Market Cap</div>
                            <div class="v2-stat-value" id="globalMcap"><span class="v2-skeleton v2-skeleton-value"></span></div>
                        </div>
                        <div class="v2-stat-card">
                            <div class="v2-stat-label">24h Volume</div>
                            <div class="v2-stat-value" id="global24hVol"><span class="v2-skeleton v2-skeleton-value"></span></div>
                        </div>
                        <div class="v2-stat-card">
                            <div class="v2-stat-label">BTC Dominance</div>
                            <div class="v2-stat-value" id="btcDominance"><span class="v2-skeleton v2-skeleton-value"></span></div>
                        </div>
                        <div class="v2-stat-card">
                            <div class="v2-stat-label">Active Cryptos</div>
                            <div class="v2-stat-value" id="activeCryptos"><span class="v2-skeleton v2-skeleton-value"></span></div>
                        </div>
                    </div>
                </div>

                <!-- Allocation Chart -->
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;">
                    <div class="v2-card v2-fade-in">
                        <div class="v2-card-header"><span class="v2-card-title">Chain Allocation</span></div>
                        <div style="height:280px;display:flex;align-items:center;justify-content:center;">
                            <canvas id="allocationChart" style="max-height:260px;"></canvas>
                        </div>
                    </div>
                    <div class="v2-card v2-fade-in">
                        <div class="v2-card-header"><span class="v2-card-title">Top Movers (24h)</span></div>
                        <div id="topMovers">
                            <div class="v2-skeleton v2-skeleton-chart" style="height:260px;"></div>
                        </div>
                    </div>
                </div>

                <!-- Portfolio Analytics -->
                <div class="v2-card v2-fade-in" style="margin-bottom:24px">
                    <div class="v2-card-header"><span class="v2-card-title">Portfolio vs. BTC Relative Strength</span></div>
                    <div style="height:300px;"><canvas id="relStrengthChart"></canvas></div>
                </div>
            </div>

            <footer class="v2-footer">ABCT V2 | Analytics</footer>
        </main>
    </div>

    <script src="/next/static/js/v2-app.js"></script>
    <script src="/next/static/js/v2-shell.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            v2InitShell('analytics');
            loadAnalytics();
        });

        async function loadAnalytics() {
            // Global market data
            try {
                const resp = await v2Fetch('/prices/global');
                if (resp.ok) {
                    const data = await resp.json();
                    setText('globalMcap', formatCompact(data.total_market_cap_usd || 0));
                    setText('global24hVol', formatCompact(data.total_volume_usd || 0));
                    setText('btcDominance', (data.btc_dominance || 0).toFixed(1) + '%');
                    setText('activeCryptos', (data.active_cryptocurrencies || 0).toLocaleString());
                }
            } catch(e) { console.error('Global market error:', e); }

            // Top Movers
            try {
                const resp = await v2Fetch('/prices/top-movers');
                if (resp.ok) {
                    const data = await resp.json();
                    renderTopMovers(data);
                }
            } catch(e) { console.error('Top movers error:', e); }

            // Chain allocation from portfolio (use all-holdings for accurate per-chain values)
            try {
                const resp = await v2Fetch('/portfolio/all-holdings');
                if (resp.ok) {
                    const data = await resp.json();
                    renderAllocationChart(data);
                }
            } catch(e) { console.error('Allocation error:', e); }

            // Relative strength (multi-asset comparison)
            try {
                const resp = await v2Fetch('/analytics/relative-strength?days=30');
                if (resp.ok) {
                    const data = await resp.json();
                    renderRelativeStrength(data);
                }
            } catch(e) { console.error('Rel strength error:', e); }
        }

        function renderTopMovers(data) {
            const container = document.getElementById('topMovers');
            const movers = data.movers || [];

            if (!movers.length) {
                setSafeHTML(container, '<div class="v2-empty" style="padding:32px"><div class="v2-empty-title">No market movers data</div></div>');
                return;
            }

            // Split into gainers (positive change) and losers (negative change)
            const gainers = movers.filter(m => (parseFloat(m.change_24h) || 0) > 0).slice(0, 5);
            const losers = movers.filter(m => (parseFloat(m.change_24h) || 0) < 0).slice(0, 5);

            let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">';
            html += '<div><div style="font-size:12px;font-weight:600;color:var(--v2-accent);margin-bottom:8px;">Top Gainers</div>';
            gainers.forEach(g => {
                html += `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;">
                    <span>${escapeHtml(g.symbol || g.name || '?')}</span>
                    <span class="v2-value-positive">+${(parseFloat(g.change_24h) || 0).toFixed(1)}%</span>
                </div>`;
            });
            if (!gainers.length) html += '<div style="padding:6px 0;font-size:12px;color:var(--v2-text-muted)">No gainers</div>';
            html += '</div>';
            html += '<div><div style="font-size:12px;font-weight:600;color:var(--v2-red);margin-bottom:8px;">Top Losers</div>';
            losers.forEach(l => {
                html += `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;">
                    <span>${escapeHtml(l.symbol || l.name || '?')}</span>
                    <span class="v2-value-negative">${(parseFloat(l.change_24h) || 0).toFixed(1)}%</span>
                </div>`;
            });
            if (!losers.length) html += '<div style="padding:6px 0;font-size:12px;color:var(--v2-text-muted)">No losers</div>';
            html += '</div></div>';
            setSafeHTML(container, html);
        }

        function renderAllocationChart(data) {
            const canvas = document.getElementById('allocationChart');
            if (!canvas) return;

            const holdings = data.holdings || [];
            if (!holdings.length) {
                const parent = canvas.parentElement;
                setSafeHTML(parent, '<div class="v2-empty" style="padding:32px"><div class="v2-empty-title">No holdings data</div></div>');
                return;
            }

            // Group holdings by source type for allocation chart
            // Backend source values: chain, native_token, L1 chain, token, exchange, staking, defi_summary, defi, etc.
            const sourceMap = {};
            holdings.forEach(h => {
                const source = (h.source || 'other').toLowerCase();
                let label;
                if (source === 'chain' || source === 'l1 chain' || source === 'native_token') label = 'Wallets';
                else if (source === 'token' || source === 'tracked_token' || source === 'custom_token') label = 'Tokens';
                else if (source === 'exchange') label = 'Exchanges';
                else if (source === 'staking') label = 'Staking';
                else if (source === 'defi' || source === 'defi_summary') label = 'DeFi';
                else label = source.charAt(0).toUpperCase() + source.slice(1);
                sourceMap[label] = (sourceMap[label] || 0) + (parseFloat(h.value_usd) || 0);
            });

            const entries = Object.entries(sourceMap).filter(([_, v]) => v > 0).sort((a, b) => b[1] - a[1]);
            if (!entries.length) return;

            const labels = entries.map(([name]) => name);
            const values = entries.map(([_, v]) => v);
            const colors = ['#0033ad', '#627eea', '#f7931a', '#14f195', '#8247e5', '#e84142', '#2775ca', '#00d4ff', '#ff6b35', '#ffd700'];

            new Chart(canvas.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{ data: values, backgroundColor: colors.slice(0, labels.length), borderWidth: 0 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: getComputedStyle(document.documentElement).getPropertyValue('--v2-text-secondary').trim() || '#8a93a6',
                                font: { size: 11 }, padding: 8, usePointStyle: true, pointStyleWidth: 8
                            }
                        },
                        tooltip: {
                            callbacks: { label: (ctx) => `${ctx.label}: ${formatCurrency(ctx.raw)}` }
                        }
                    }
                }
            });
        }

        function renderRelativeStrength(data) {
            const canvas = document.getElementById('relStrengthChart');
            if (!canvas) return;

            const assets = data.assets || {};
            const assetKeys = Object.keys(assets);

            if (!assetKeys.length) {
                const parent = canvas.parentElement;
                setSafeHTML(parent, '<div class="v2-empty" style="padding:40px"><div class="v2-empty-title">No relative strength data available</div><div class="v2-empty-desc">Market data needed for relative strength analysis.</div></div>');
                return;
            }

            // Use the first asset's dates as labels
            const firstAsset = assets[assetKeys[0]] || [];
            const labels = firstAsset.map(p => {
                try { return new Date(p.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); } catch { return ''; }
            });

            // Asset colors
            const assetColors = { 'BTC': '#f7931a', 'ETH': '#627eea', 'SOL': '#14f195', 'ADA': '#0033ad', 'POL': '#8247e5' };

            const style = getComputedStyle(document.documentElement);
            const textColor = style.getPropertyValue('--v2-chart-text').trim() || '#5a6475';
            const gridColor = style.getPropertyValue('--v2-chart-grid').trim() || 'rgba(255,255,255,0.04)';

            const datasets = assetKeys.map(symbol => ({
                label: symbol,
                data: (assets[symbol] || []).map(p => p.change_pct || 0),
                borderColor: assetColors[symbol] || '#888',
                borderWidth: 2,
                pointRadius: 0,
                fill: false,
                tension: 0.3,
            }));

            new Chart(canvas.getContext('2d'), {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: textColor, font: { size: 11 } } },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: { label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y >= 0 ? '+' : ''}${ctx.parsed.y.toFixed(1)}%` }
                        }
                    },
                    scales: {
                        x: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 }, maxTicksLimit: 8 }, border: { display: false } },
                        y: {
                            grid: { color: gridColor },
                            ticks: { color: textColor, font: { size: 10 }, callback: (val) => (val >= 0 ? '+' : '') + val.toFixed(0) + '%' },
                            border: { display: false }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
