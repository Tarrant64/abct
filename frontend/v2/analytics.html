<!DOCTYPE html>
<html lang="en" data-theme="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - ABCT V2</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.ico">
    <link rel="stylesheet" href="/v2/static/css/v2.css">
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <script src="/static/js/session-auth.js?v=1772669294"></script>
</head>
<body>
    <div class="v2-layout" id="v2Layout">
        <nav class="v2-sidebar" id="v2Sidebar"></nav>
        <main class="v2-main">
            <header class="v2-topbar">
                <div class="v2-topbar-left"><span class="v2-topbar-title">Analytics</span></div>
                <div class="v2-topbar-right"><div class="v2-user-menu"></div></div>
            </header>

            <div class="v2-content">
                <!-- Market Summary -->
                <div class="v2-card v2-fade-in" style="margin-bottom:24px">
                    <div class="v2-card-header">
                        <span class="v2-card-title">Global Market</span>
                    </div>
                    <div class="v2-stats-grid" id="marketStats" style="margin-bottom:0">
                        <div class="v2-stat-card">
                            <div class="v2-stat-label">Total Market Cap</div>
                            <div class="v2-stat-value" id="globalMcap"><span class="v2-skeleton v2-skeleton-value"></span></div>
                        </div>
                        <div class="v2-stat-card">
                            <div class="v2-stat-label">24h Volume</div>
                            <div class="v2-stat-value" id="global24hVol"><span class="v2-skeleton v2-skeleton-value"></span></div>
                        </div>
                        <div class="v2-stat-card">
                            <div class="v2-stat-label">BTC Dominance</div>
                            <div class="v2-stat-value" id="btcDominance"><span class="v2-skeleton v2-skeleton-value"></span></div>
                        </div>
                        <div class="v2-stat-card">
                            <div class="v2-stat-label">Active Cryptos</div>
                            <div class="v2-stat-value" id="activeCryptos"><span class="v2-skeleton v2-skeleton-value"></span></div>
                        </div>
                    </div>
                </div>

                <!-- Allocation Chart -->
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;">
                    <div class="v2-card v2-fade-in">
                        <div class="v2-card-header"><span class="v2-card-title">Chain Allocation</span></div>
                        <div style="height:280px;display:flex;align-items:center;justify-content:center;">
                            <canvas id="allocationChart" style="max-height:260px;"></canvas>
                        </div>
                    </div>
                    <div class="v2-card v2-fade-in">
                        <div class="v2-card-header"><span class="v2-card-title">Top Movers (24h)</span></div>
                        <div id="topMovers">
                            <div class="v2-skeleton v2-skeleton-chart" style="height:260px;"></div>
                        </div>
                    </div>
                </div>

                <!-- Portfolio Analytics -->
                <div class="v2-card v2-fade-in" style="margin-bottom:24px">
                    <div class="v2-card-header"><span class="v2-card-title">Portfolio vs. BTC Relative Strength</span></div>
                    <div style="height:300px;"><canvas id="relStrengthChart"></canvas></div>
                </div>
            </div>

            <footer class="v2-footer">ABCT V2 | Analytics</footer>
        </main>
    </div>

    <script src="/v2/static/js/v2-app.js"></script>
    <script src="/v2/static/js/v2-shell.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            v2InitShell('analytics');
            loadAnalytics();
        });

        async function loadAnalytics() {
            // Global market data
            try {
                const resp = await v2Fetch('/prices/global');
                if (resp.ok) {
                    const data = await resp.json();
                    setText('globalMcap', formatCompact(data.total_market_cap_usd || data.total_market_cap || 0));
                    setText('global24hVol', formatCompact(data.total_24h_volume_usd || data.total_volume || 0));
                    setText('btcDominance', (data.btc_dominance || data.bitcoin_dominance_percentage || 0).toFixed(1) + '%');
                    setText('activeCryptos', (data.active_cryptocurrencies || 0).toLocaleString());
                }
            } catch(e) { console.error('Global market error:', e); }

            // Top Movers
            try {
                const resp = await v2Fetch('/prices/top-movers');
                if (resp.ok) {
                    const data = await resp.json();
                    renderTopMovers(data);
                }
            } catch(e) { console.error('Top movers error:', e); }

            // Chain allocation from portfolio
            try {
                const resp = await v2Fetch('/portfolio/summary');
                if (resp.ok) {
                    const data = await resp.json();
                    renderAllocationChart(data);
                }
            } catch(e) { console.error('Allocation error:', e); }

            // Relative strength
            try {
                const resp = await v2Fetch('/analytics/relative-strength');
                if (resp.ok) {
                    const data = await resp.json();
                    renderRelativeStrength(data);
                }
            } catch(e) { console.error('Rel strength error:', e); }
        }

        function renderTopMovers(data) {
            const container = document.getElementById('topMovers');
            const gainers = data.gainers || [];
            const losers = data.losers || [];

            let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">';
            html += '<div><div style="font-size:12px;font-weight:600;color:var(--v2-accent);margin-bottom:8px;">Top Gainers</div>';
            (gainers.slice(0, 5) || []).forEach(g => {
                html += `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;">
                    <span>${escapeHtml(g.symbol || g.name || '?')}</span>
                    <span class="v2-value-positive">+${(g.change_24h || g.price_change_percentage_24h || 0).toFixed(1)}%</span>
                </div>`;
            });
            html += '</div>';
            html += '<div><div style="font-size:12px;font-weight:600;color:var(--v2-red);margin-bottom:8px;">Top Losers</div>';
            (losers.slice(0, 5) || []).forEach(l => {
                html += `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;">
                    <span>${escapeHtml(l.symbol || l.name || '?')}</span>
                    <span class="v2-value-negative">${(l.change_24h || l.price_change_percentage_24h || 0).toFixed(1)}%</span>
                </div>`;
            });
            html += '</div></div>';
            setSafeHTML(container, html);
        }

        function renderAllocationChart(data) {
            const canvas = document.getElementById('allocationChart');
            if (!canvas || !data.chains) return;

            const chains = Object.entries(data.chains).filter(([_, v]) => (v.total_value_usd || v.total || 0) > 0);
            chains.sort((a, b) => (b[1].total_value_usd || b[1].total || 0) - (a[1].total_value_usd || a[1].total || 0));

            const labels = chains.map(([name]) => name.charAt(0).toUpperCase() + name.slice(1));
            const values = chains.map(([_, v]) => v.total_value_usd || v.total || 0);
            const colors = ['#0033ad', '#627eea', '#f7931a', '#14f195', '#8247e5', '#e84142', '#2775ca', '#00d4ff', '#ff6b35', '#ffd700'];

            new Chart(canvas.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels,
                    datasets: [{ data: values, backgroundColor: colors.slice(0, labels.length), borderWidth: 0 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '65%',
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: { color: 'var(--v2-text-secondary)', font: { size: 11 }, padding: 8, usePointStyle: true, pointStyleWidth: 8 }
                        },
                        tooltip: {
                            callbacks: { label: (ctx) => `${ctx.label}: ${formatCurrency(ctx.raw)}` }
                        }
                    }
                }
            });
        }

        function renderRelativeStrength(data) {
            const canvas = document.getElementById('relStrengthChart');
            if (!canvas) return;

            const points = data.data || data.history || [];
            if (!points.length) return;

            const labels = points.map(p => {
                try { return new Date(p.date || p.timestamp).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); } catch { return ''; }
            });
            const portfolioValues = points.map(p => p.portfolio_normalized || p.portfolio || 0);
            const btcValues = points.map(p => p.btc_normalized || p.btc || 0);

            const style = getComputedStyle(document.documentElement);
            const accentColor = style.getPropertyValue('--v2-accent').trim() || '#00d26a';

            new Chart(canvas.getContext('2d'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Portfolio', data: portfolioValues, borderColor: accentColor, borderWidth: 2, pointRadius: 0, fill: false, tension: 0.3 },
                        { label: 'BTC', data: btcValues, borderColor: '#f7931a', borderWidth: 2, pointRadius: 0, fill: false, tension: 0.3 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: 'var(--v2-text-secondary)', font: { size: 11 } } },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: { grid: { color: 'var(--v2-chart-grid)' }, ticks: { color: 'var(--v2-chart-text)', font: { size: 10 }, maxTicksLimit: 8 }, border: { display: false } },
                        y: { grid: { color: 'var(--v2-chart-grid)' }, ticks: { color: 'var(--v2-chart-text)', font: { size: 10 } }, border: { display: false } }
                    }
                }
            });
        }
    </script>
</body>
</html>
