<!DOCTYPE html>
<html lang="en" data-theme="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallets - ABCT V2</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.ico">
    <link rel="stylesheet" href="/next/static/css/v2.css">
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <script src="/static/js/session-auth.js?v=1772669294"></script>
    <style>
        .wallet-card { background: var(--v2-bg-card); border: 1px solid var(--v2-border); border-radius: var(--v2-radius-lg); padding: 16px; margin-bottom: 12px; transition: all 0.2s; }
        .wallet-card:hover { border-color: var(--v2-border-light); }
        .wallet-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .wallet-card-label { font-size: 15px; font-weight: 600; color: var(--v2-text-heading); }
        .wallet-card-addr { font-family: monospace; font-size: 12px; color: var(--v2-text-muted); word-break: break-all; }
        .wallet-card-stats { display: flex; gap: 24px; margin-top: 12px; }
        .wallet-card-stat { }
        .wallet-card-stat-label { font-size: 11px; color: var(--v2-text-muted); }
        .wallet-card-stat-value { font-size: 14px; font-weight: 600; color: var(--v2-text-heading); }
        .wallet-actions { display: flex; gap: 8px; }
        .add-wallet-form { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: end; }
        .add-wallet-form .field { display: flex; flex-direction: column; gap: 4px; }
        .add-wallet-form label { font-size: 12px; color: var(--v2-text-secondary); }
        .add-wallet-form input, .add-wallet-form select { padding: 8px 12px; background: var(--v2-bg-input); border: 1px solid var(--v2-border-input); border-radius: var(--v2-radius-sm); color: var(--v2-text-primary); font-size: 13px; }
    </style>
</head>
<body>
    <div class="v2-layout" id="v2Layout">
        <nav class="v2-sidebar" id="v2Sidebar"></nav>
        <main class="v2-main">
            <header class="v2-topbar">
                <div class="v2-topbar-left"><span class="v2-topbar-title">Wallet Management</span></div>
                <div class="v2-topbar-right">
                    <button class="v2-sync-btn" onclick="refreshAllWallets()"><span class="sync-icon">&#10227;</span> Refresh All</button>
                    <div class="v2-user-menu"></div>
                </div>
            </header>

            <div class="v2-content">
                <!-- Add Wallet -->
                <div class="v2-card v2-fade-in" style="margin-bottom:24px;">
                    <div class="v2-card-header"><span class="v2-card-title">Add Wallet</span></div>
                    <div class="add-wallet-form">
                        <div class="field">
                            <label>Wallet Address</label>
                            <input type="text" id="newWalletAddr" placeholder="Enter wallet address...">
                        </div>
                        <div class="field">
                            <label>Label (optional)</label>
                            <input type="text" id="newWalletLabel" placeholder="My Wallet">
                        </div>
                        <button class="v2-btn v2-btn-primary" onclick="addWallet()">Add</button>
                    </div>
                    <div style="margin-top:8px;font-size:12px;color:var(--v2-text-muted);">Blockchain will be auto-detected from the address format.</div>
                </div>

                <!-- Wallet List -->
                <div class="v2-fade-in" id="walletList">
                    <div class="v2-skeleton v2-skeleton-chart" style="height:200px;"></div>
                </div>
            </div>

            <footer class="v2-footer">ABCT V2 | Wallets</footer>
        </main>
    </div>

    <script src="/next/static/js/v2-app.js"></script>
    <script src="/next/static/js/v2-shell.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            v2InitShell('wallets');
            loadWallets();
        });

        async function loadWallets() {
            try {
                const resp = await v2Fetch('/wallets');
                if (!resp.ok) throw new Error('Failed to load wallets');
                const data = await resp.json();
                renderWallets(data);
            } catch(e) {
                setSafeHTML(document.getElementById('walletList'), '<div class="v2-empty"><div class="v2-empty-title">Could not load wallets</div></div>');
            }
        }

        function renderWallets(data) {
            const container = document.getElementById('walletList');
            const wallets = data.wallets || data || [];

            if (!wallets.length) {
                setSafeHTML(container, '<div class="v2-empty" style="padding:48px"><div class="v2-empty-icon" style="font-size:48px;opacity:0.2">&#128091;</div><div class="v2-empty-title">No wallets added yet</div><div class="v2-empty-desc">Add your first wallet above to start tracking your portfolio.</div></div>');
                return;
            }

            // Group by stake address or blockchain
            let html = '';
            wallets.forEach(w => {
                const addr = w.address || '';
                const label = w.label || w.name || 'Wallet';
                const blockchain = w.blockchain || 'unknown';
                const balance = w.balance || 0;
                const valueUsd = w.value_usd || 0;

                html += `<div class="wallet-card">
                    <div class="wallet-card-header">
                        <div>
                            <div class="wallet-card-label">${escapeHtml(label)}</div>
                            <div style="margin-top:2px;"><span class="v2-chain-badge">${escapeHtml(blockchain)}</span></div>
                        </div>
                        <div class="wallet-actions">
                            <button class="v2-btn v2-btn-ghost v2-btn-sm" onclick="refreshWallet('${escapeAttr(addr)}')" title="Refresh">&#10227;</button>
                            <button class="v2-btn v2-btn-ghost v2-btn-sm" onclick="deleteWallet('${escapeAttr(addr)}')" title="Delete" style="color:var(--v2-red)">&#10005;</button>
                        </div>
                    </div>
                    <div class="wallet-card-addr">${escapeHtml(addr)}</div>
                    <div class="wallet-card-stats">
                        <div class="wallet-card-stat">
                            <div class="wallet-card-stat-label">Balance</div>
                            <div class="wallet-card-stat-value v2-blur">${formatAmount(balance)} ${escapeHtml(w.symbol || blockchain.toUpperCase())}</div>
                        </div>
                        <div class="wallet-card-stat">
                            <div class="wallet-card-stat-label">Value</div>
                            <div class="wallet-card-stat-value v2-blur">${formatCurrency(valueUsd)}</div>
                        </div>
                    </div>
                </div>`;
            });
            setSafeHTML(container, html);
        }

        async function addWallet() {
            const addr = document.getElementById('newWalletAddr').value.trim();
            const label = document.getElementById('newWalletLabel').value.trim();
            if (!addr) { showToast('Please enter a wallet address', 'error'); return; }

            try {
                const resp = await v2Fetch('/wallets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: addr, label: label || undefined })
                });
                if (resp.ok) {
                    showToast('Wallet added successfully', 'success');
                    document.getElementById('newWalletAddr').value = '';
                    document.getElementById('newWalletLabel').value = '';
                    loadWallets();
                } else {
                    const err = await resp.json().catch(() => ({}));
                    showToast(err.detail || 'Failed to add wallet', 'error');
                }
            } catch(e) { showToast('Error adding wallet', 'error'); }
        }

        async function refreshWallet(address) {
            showToast('Refreshing wallet...', 'success');
            try {
                await v2Fetch(`/wallets/${encodeURIComponent(address)}/refresh`, { method: 'POST' });
                await loadWallets();
            } catch(e) { showToast('Refresh failed', 'error'); }
        }

        async function deleteWallet(address) {
            if (!confirm('Delete this wallet? This cannot be undone.')) return;
            try {
                const resp = await v2Fetch(`/wallets/${encodeURIComponent(address)}`, { method: 'DELETE' });
                if (resp.ok) {
                    showToast('Wallet deleted', 'success');
                    loadWallets();
                } else { showToast('Delete failed', 'error'); }
            } catch(e) { showToast('Error deleting wallet', 'error'); }
        }

        async function refreshAllWallets() {
            showToast('Refreshing all wallets...', 'success');
            try {
                await v2Fetch('/wallets/refresh', { method: 'POST' });
                await loadWallets();
                showToast('All wallets refreshed', 'success');
            } catch(e) { showToast('Refresh failed', 'error'); }
        }
    </script>
</body>
</html>
