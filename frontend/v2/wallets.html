<!DOCTYPE html>
<html lang="en" data-theme="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallets - ABCT V2</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.ico">
    <link rel="stylesheet" href="/next/static/css/v2.css">
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <script src="/static/js/session-auth.js?v=1782655285"></script>
    <style>
        .wallet-card { background: var(--v2-bg-card); border: 1px solid var(--v2-border); border-radius: var(--v2-radius-lg); padding: 16px; margin-bottom: 12px; transition: all 0.2s; }
        .wallet-card:hover { border-color: var(--v2-border-light); }
        .wallet-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .wallet-card-label { font-size: 15px; font-weight: 600; color: var(--v2-text-heading); }
        .wallet-card-addr { font-family: monospace; font-size: 12px; color: var(--v2-text-muted); word-break: break-all; }
        .wallet-card-stats { display: flex; gap: 24px; margin-top: 12px; }
        .wallet-card-stat { }
        .wallet-card-stat-label { font-size: 11px; color: var(--v2-text-muted); }
        .wallet-card-stat-value { font-size: 14px; font-weight: 600; color: var(--v2-text-heading); }
        .wallet-actions { display: flex; gap: 8px; }
        .wallet-actions .v2-btn { min-width: 36px; min-height: 36px; font-size: 18px; display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: var(--v2-radius-sm); }
        .add-wallet-form { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: end; }
        .add-wallet-form .field { display: flex; flex-direction: column; gap: 4px; }
        .add-wallet-form label { font-size: 12px; color: var(--v2-text-secondary); }
        .add-wallet-form input, .add-wallet-form select { padding: 8px 12px; background: var(--v2-bg-input); border: 1px solid var(--v2-border-input); border-radius: var(--v2-radius-sm); color: var(--v2-text-primary); font-size: 13px; }

        /* Chain filter bar */
        .chain-filter-bar { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; padding: 8px; background: var(--v2-bg-card); border: 1px solid var(--v2-border); border-radius: var(--v2-radius-md); }
        .chain-filter-btn { padding: 5px 14px; border-radius: 16px; font-size: 12px; font-weight: 500; border: 1px solid var(--v2-border-input); background: transparent; color: var(--v2-text-secondary); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
        .chain-filter-btn:hover { border-color: var(--v2-text-muted); color: var(--v2-text-primary); }
        .chain-filter-btn.active { background: var(--v2-accent-muted); border-color: var(--v2-accent); color: var(--v2-accent-text); }
        .chain-filter-btn .chain-count { background: var(--v2-bg-input); padding: 1px 6px; border-radius: 10px; font-size: 10px; }
        .chain-filter-btn.active .chain-count { background: rgba(0,210,106,0.25); }
        .chain-filter-btn.chain-cardano.active { background: rgba(0, 51, 173, 0.15); border-color: #5c9eff; color: #5c9eff; }
        .chain-filter-btn.chain-bitcoin.active { background: rgba(247, 147, 26, 0.15); border-color: #f7931a; color: #f7931a; }
        .chain-filter-btn.chain-ethereum.active { background: rgba(98, 126, 234, 0.15); border-color: #8ba4f5; color: #8ba4f5; }
        .chain-filter-btn.chain-solana.active { background: rgba(20, 241, 149, 0.15); border-color: #3dffb3; color: #3dffb3; }
        .chain-filter-btn.chain-polygon.active { background: rgba(130, 71, 229, 0.15); border-color: #a673f0; color: #a673f0; }
        .chain-filter-btn.chain-base.active { background: rgba(0, 82, 255, 0.15); border-color: #5c9eff; color: #5c9eff; }

        /* Stake group header */
        .stake-group { margin-bottom: 16px; }
        .stake-group-title { font-size: 12px; font-weight: 600; color: var(--v2-text-muted); padding: 8px 0 6px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--v2-border); margin-bottom: 8px; }
        .stake-group-title .stake-addr { font-family: monospace; font-size: 11px; font-weight: 400; }

        /* Expandable native tokens */
        .wallet-tokens-toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--v2-accent-text); cursor: pointer; margin-top: 8px; padding: 3px 8px; border: 1px solid var(--v2-border-input); border-radius: var(--v2-radius-sm); background: transparent; transition: all 0.2s; }
        .wallet-tokens-toggle:hover { background: var(--v2-accent-muted); border-color: var(--v2-accent); }
        .wallet-tokens-list { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--v2-border); }
        .wallet-tokens-list.show { display: block; }
        .token-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px; }
        .token-item-name { color: var(--v2-text-secondary); }
        .token-item-qty { color: var(--v2-text-primary); font-family: monospace; }
    </style>
</head>
<body>
    <div class="v2-layout" id="v2Layout">
        <nav class="v2-sidebar" id="v2Sidebar"></nav>
        <main class="v2-main">
            <header class="v2-topbar">
                <div class="v2-topbar-left"><span class="v2-topbar-title">Wallet Management</span></div>
                <div class="v2-topbar-right">
                    <button class="v2-sync-btn" id="refreshAllBtn"><span class="sync-icon">&#10227;</span> Refresh All</button>
                    <div class="v2-user-menu"></div>
                </div>
            </header>

            <div class="v2-content">
                <!-- Add Wallet -->
                <div class="v2-card v2-fade-in" style="margin-bottom:24px;">
                    <div class="v2-card-header"><span class="v2-card-title">Add Wallet</span></div>
                    <div class="add-wallet-form">
                        <div class="field">
                            <label>Wallet Address</label>
                            <input type="text" id="newWalletAddr" placeholder="Enter wallet address or $handle...">
                        </div>
                        <div class="field">
                            <label>Label (optional)</label>
                            <input type="text" id="newWalletLabel" placeholder="My Wallet">
                        </div>
                        <button class="v2-btn v2-btn-primary" id="addWalletBtn">Add</button>
                    </div>
                    <div style="margin-top:8px;font-size:12px;color:var(--v2-text-muted);">Blockchain will be auto-detected from the address format. Cardano ADA Handles ($handle) are supported.</div>
                </div>

                <!-- Chain Filter Tabs -->
                <div class="chain-filter-bar" id="chainFilterBar"></div>

                <!-- Wallet List -->
                <div class="v2-fade-in" id="walletList">
                    <div class="v2-skeleton v2-skeleton-chart" style="height:200px;"></div>
                </div>
            </div>

            <footer class="v2-footer">ABCT V2 | Wallets</footer>
        </main>
    </div>

    <script src="/next/static/js/v2-cache.js"></script>
    <script src="/next/static/js/v2-app.js"></script>
    <script src="/next/static/js/v2-shell.js"></script>
    <script>
        let wallets = [];
        let currentChainFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            v2InitShell('wallets');

            // Attach event listeners (no inline handlers)
            document.getElementById('refreshAllBtn').addEventListener('click', refreshAllWallets);
            document.getElementById('addWalletBtn').addEventListener('click', addWallet);

            loadWallets();
        });

        async function loadWallets() {
            try {
                var data;
                if (typeof v2CachedFetch === 'function') {
                    var result = await v2CachedFetch('/wallets');
                    data = result.data;
                } else {
                    var resp = await v2Fetch('/wallets');
                    if (!resp.ok) {
                        var errData = await resp.json().catch(function() { return {}; });
                        throw new Error(errData.detail || 'HTTP ' + resp.status);
                    }
                    data = await resp.json();
                }
                wallets = data.wallets || data || [];
                renderChainFilters();
                renderWallets();
            } catch(e) {
                console.error('Wallet load error:', e);
                setSafeHTML(document.getElementById('walletList'),
                    '<div class="v2-empty"><div class="v2-empty-title">Could not load wallets</div><div class="v2-empty-desc">' + escapeHtml(e.message || 'Unknown error') + '</div></div>');
            }
        }

        function renderChainFilters() {
            const container = document.getElementById('chainFilterBar');
            if (!container) return;

            const chainCounts = {};
            wallets.forEach(w => {
                const chain = (w.blockchain || 'unknown').toLowerCase();
                chainCounts[chain] = (chainCounts[chain] || 0) + 1;
            });

            let html = '<button class="chain-filter-btn active" data-chain="all">All <span class="chain-count">' + wallets.length + '</span></button>';
            const orderedChains = ['cardano', 'bitcoin', 'ethereum', 'solana', 'polygon', 'base', 'algorand', 'bsc', 'arbitrum', 'avalanche', 'tron', 'xrp'];
            const seenChains = new Set(orderedChains);

            orderedChains.forEach(chain => {
                if (chainCounts[chain]) {
                    html += '<button class="chain-filter-btn chain-' + escapeAttr(chain) + '" data-chain="' + escapeAttr(chain) + '">' + escapeHtml(chain.charAt(0).toUpperCase() + chain.slice(1)) + ' <span class="chain-count">' + chainCounts[chain] + '</span></button>';
                }
            });
            Object.keys(chainCounts).forEach(chain => {
                if (!seenChains.has(chain)) {
                    html += '<button class="chain-filter-btn chain-' + escapeAttr(chain) + '" data-chain="' + escapeAttr(chain) + '">' + escapeHtml(chain.charAt(0).toUpperCase() + chain.slice(1)) + ' <span class="chain-count">' + chainCounts[chain] + '</span></button>';
                }
            });

            setSafeHTML(container, html);

            container.querySelectorAll('.chain-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentChainFilter = btn.dataset.chain;
                    container.querySelectorAll('.chain-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.chain === currentChainFilter));
                    renderWallets();
                });
            });
        }

        function renderWallets() {
            const container = document.getElementById('walletList');
            const filtered = currentChainFilter === 'all'
                ? wallets
                : wallets.filter(w => (w.blockchain || '').toLowerCase() === currentChainFilter);

            if (!filtered.length) {
                setSafeHTML(container, '<div class="v2-empty" style="padding:48px"><div class="v2-empty-title">' + (currentChainFilter === 'all' ? 'No wallets added yet' : 'No ' + escapeHtml(currentChainFilter) + ' wallets') + '</div><div class="v2-empty-desc">' + (currentChainFilter === 'all' ? 'Add your first wallet above to start tracking your portfolio.' : 'Switch to All to see all wallets.') + '</div></div>');
                return;
            }

            // Group Cardano wallets by stake address
            const stakeGroups = {};
            const ungrouped = [];

            filtered.forEach(w => {
                const chain = (w.blockchain || 'unknown').toLowerCase();
                if (chain === 'cardano' && w.stake_address) {
                    if (!stakeGroups[w.stake_address]) {
                        stakeGroups[w.stake_address] = [];
                    }
                    stakeGroups[w.stake_address].push(w);
                } else {
                    ungrouped.push(w);
                }
            });

            let html = '';

            // Render stake groups
            Object.entries(stakeGroups).forEach(([stakeAddr, groupWallets]) => {
                const shortStake = stakeAddr.slice(0, 12) + '...' + stakeAddr.slice(-6);
                const groupHandle = groupWallets.find(w => w.ada_handle);
                const groupHandleBadge = groupHandle ? ' <span class="v2-ada-handle-badge">' + escapeHtml(groupHandle.ada_handle) + '</span>' : '';
                html += '<div class="stake-group">';
                html += '<div class="stake-group-title"><span>Cardano Stake Key:</span> <span class="stake-addr">' + escapeHtml(shortStake) + '</span>' + groupHandleBadge + ' <span style="color:var(--v2-text-muted);">(' + groupWallets.length + ' wallet' + (groupWallets.length > 1 ? 's' : '') + ')</span></div>';
                groupWallets.forEach(w => { html += renderWalletCard(w); });
                html += '</div>';
            });

            // Render ungrouped
            ungrouped.forEach(w => { html += renderWalletCard(w); });

            setSafeHTML(container, html);

            // Attach event listeners after rendering
            container.querySelectorAll('.wallet-refresh-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    refreshWallet(btn.dataset.addr);
                });
            });
            container.querySelectorAll('.wallet-delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteWallet(btn.dataset.addr);
                });
            });
            container.querySelectorAll('.wallet-tokens-toggle').forEach(btn => {
                btn.addEventListener('click', () => toggleTokens(btn.dataset.addr));
            });
        }

        function renderWalletCard(w) {
            const addr = w.address || '';
            // Display priority: custom label > ada_handle > default
            const label = w.label || w.ada_handle || w.name || 'Wallet';
            const blockchain = (w.blockchain || 'unknown').toLowerCase();
            const balance = parseFloat(w.balance) || 0;
            const balanceUnit = w.balance_unit || w.symbol || blockchain.toUpperCase();
            const valueUsd = parseFloat(w.value_usd) || 0;
            const tokenCount = parseInt(w.native_assets_count) || 0;
            const handleBadge = w.ada_handle ? ' <span class="v2-ada-handle-badge">' + escapeHtml(w.ada_handle) + '</span>' : '';

            let html = '<div class="wallet-card" data-address="' + escapeAttr(addr) + '">';
            html += '<div class="wallet-card-header"><div>';
            html += '<div class="wallet-card-label">' + escapeHtml(label) + handleBadge + '</div>';
            html += '<div style="margin-top:2px;"><span class="v2-chain-badge chain-' + escapeAttr(blockchain) + '">' + escapeHtml(blockchain) + '</span>';
            if (tokenCount > 0) {
                html += ' <span style="font-size:11px;color:var(--v2-text-muted);margin-left:6px;">' + tokenCount + ' token' + (tokenCount !== 1 ? 's' : '') + '</span>';
            }
            html += '</div></div>';
            html += '<div class="wallet-actions">';
            html += '<button class="v2-btn v2-btn-ghost v2-btn-sm wallet-refresh-btn" data-addr="' + escapeAttr(addr) + '" title="Refresh">&#10227;</button>';
            html += '<button class="v2-btn v2-btn-ghost v2-btn-sm wallet-delete-btn" data-addr="' + escapeAttr(addr) + '" title="Delete" style="color:var(--v2-red)">&#10005;</button>';
            html += '</div></div>';
            html += '<div class="wallet-card-addr">' + escapeHtml(addr) + '</div>';
            html += '<div class="wallet-card-stats">';
            html += '<div class="wallet-card-stat"><div class="wallet-card-stat-label">Balance</div><div class="wallet-card-stat-value v2-blur">' + formatAmount(balance) + ' ' + escapeHtml(balanceUnit) + '</div></div>';
            if (valueUsd > 0) {
                html += '<div class="wallet-card-stat"><div class="wallet-card-stat-label">Value</div><div class="wallet-card-stat-value v2-blur">' + formatCurrency(valueUsd) + '</div></div>';
            }
            html += '</div>';

            // Expandable token list
            if (tokenCount > 0) {
                html += '<button class="wallet-tokens-toggle" data-addr="' + escapeAttr(addr) + '"><span style="font-size:9px;">&#9654;</span> Show ' + tokenCount + ' tokens</button>';
                html += '<div class="wallet-tokens-list" id="tokens-' + escapeAttr(addr) + '"><span style="font-size:12px;color:var(--v2-text-muted);">Loading...</span></div>';
            }

            html += '</div>';
            return html;
        }

        async function toggleTokens(address) {
            const list = document.getElementById('tokens-' + address);
            if (!list) return;

            const btn = document.querySelector('.wallet-tokens-toggle[data-addr="' + address + '"]');
            const isVisible = list.classList.contains('show');

            if (isVisible) {
                list.classList.remove('show');
                const tokenCount = parseInt(btn.textContent.match(/\d+/)?.[0]) || 0;
                if (btn) btn.innerHTML = '<span style="font-size:9px;">&#9654;</span> Show ' + tokenCount + ' tokens';
            } else {
                list.classList.add('show');
                if (btn) btn.innerHTML = '<span style="font-size:9px;">&#9660;</span> Hide tokens';

                // Load if not yet loaded
                if (list.dataset.loaded !== 'true') {
                    try {
                        const resp = await v2Fetch('/wallets/' + encodeURIComponent(address) + '/native-assets');
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        const data = await resp.json();
                        const assets = data.assets || data.native_assets || data || [];

                        if (!assets.length) {
                            setSafeHTML(list, '<span style="font-size:12px;color:var(--v2-text-muted);">No native tokens found</span>');
                        } else {
                            let html = '';
                            assets.slice(0, 50).forEach(a => {
                                const name = a.name || a.asset_name || a.ticker || 'Unknown';
                                const qty = parseFloat(a.quantity) || parseFloat(a.amount) || 0;
                                html += '<div class="token-item"><span class="token-item-name">' + escapeHtml(name) + '</span><span class="token-item-qty v2-blur">' + formatAmount(qty) + '</span></div>';
                            });
                            if (assets.length > 50) {
                                html += '<div style="font-size:11px;color:var(--v2-text-muted);padding-top:4px;">+ ' + (assets.length - 50) + ' more tokens</div>';
                            }
                            setSafeHTML(list, html);
                        }
                        list.dataset.loaded = 'true';
                    } catch(e) {
                        setSafeHTML(list, '<span style="font-size:12px;color:var(--v2-red);">Failed to load: ' + escapeHtml(e.message) + '</span>');
                    }
                }
            }
        }

        async function addWallet() {
            const addr = document.getElementById('newWalletAddr').value.trim();
            const label = document.getElementById('newWalletLabel').value.trim();
            if (!addr) { showToast('Please enter a wallet address', 'error'); return; }

            try {
                const resp = await v2Fetch('/wallets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: addr, label: label || undefined })
                });
                if (resp.ok) {
                    const data = await resp.json().catch(() => ({}));
                    const msg = data.ada_handle
                        ? 'Wallet added via ADA Handle ' + (data.ada_handle || '')
                        : 'Wallet added successfully';
                    showToast(msg, 'success');
                    document.getElementById('newWalletAddr').value = '';
                    document.getElementById('newWalletLabel').value = '';
                    loadWallets();
                } else {
                    const err = await resp.json().catch(() => ({}));
                    showToast(err.detail || 'Failed to add wallet', 'error');
                }
            } catch(e) { showToast('Error adding wallet', 'error'); }
        }

        async function refreshWallet(address) {
            showToast('Refreshing wallet...', 'success');
            try {
                await v2Fetch('/wallets/' + encodeURIComponent(address) + '/refresh', { method: 'POST' });
                await loadWallets();
            } catch(e) { showToast('Refresh failed', 'error'); }
        }

        async function deleteWallet(address) {
            if (!confirm('Delete this wallet? This cannot be undone.')) return;
            try {
                const resp = await v2Fetch('/wallets/' + encodeURIComponent(address), { method: 'DELETE' });
                if (resp.ok) {
                    showToast('Wallet deleted', 'success');
                    loadWallets();
                } else { showToast('Delete failed', 'error'); }
            } catch(e) { showToast('Error deleting wallet', 'error'); }
        }

        async function refreshAllWallets() {
            if (typeof V2_CACHE !== 'undefined') V2_CACHE.clearByPrefix('/wallets');
            showToast('Refreshing all wallets...', 'success');
            try {
                await v2Fetch('/wallets/refresh', { method: 'POST' });
                await loadWallets();
                showToast('All wallets refreshed', 'success');
            } catch(e) { showToast('Refresh failed', 'error'); }
        }
    </script>
</body>
</html>
