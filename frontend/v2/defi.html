                    var stakes = protocolData.staked;
                    Object.keys(stakes).forEach(function(token) {
                        var data = stakes[token];
                        var tokenPrice = getTokenPrice(token);
                        var usdValue = data.amount * tokenPrice;
                        totalStakedValue += usdValue;
                        stakedCount++;

                        var pendingHtml = '';
                        var pendRew = protocolData.pending_rewards || 0;
                        var rewTk = protocolData.reward_token || '';
                        if (pendRew > 0 && rewTk) {
                            var rewPrice = getTokenPrice(rewTk);
                            var pendUsd = pendRew * rewPrice;
                            totalPendingValue += pendUsd;
                            pendingHtml = '<div class="defi-card-pending"><div class="defi-pending-label">Pending</div>' +
                                '<div class="defi-pending-row"><span class="defi-pending-amount v2-blur">' + pendRew.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4}) + ' ' + escapeHtml(rewTk) + '</span>' +
                                (pendUsd > 0 ? '<span class="defi-pending-usd v2-blur">' + formatCurrency(pendUsd) + '</span>' : '') + '</div></div>';
                        }

                        html += '<div class="defi-card" data-protocol="' + escapeAttr(protocol) + '" id="depin-card-' + escapeAttr(protocol) + '">' +
                            '<div class="defi-card-header">' + logoImgHtml(token, data.logo_url, 32) +
                            '<span class="defi-card-protocol">' + getChainBadge(stakingChain) + ' ' + escapeHtml(protocol) + '</span>' +
                            '<div class="defi-card-badges"><span class="defi-badge defi-badge-depin">DePIN</span></div>' +
                            refreshBtnHtml + '</div>' +
                            '<div class="defi-card-amount v2-blur">' + data.amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4}) + ' <span style="font-size:14px;font-weight:400">' + escapeHtml(token) + '</span></div>' +
                            '<div class="defi-card-value v2-blur">' + formatCurrency(usdValue) + '</div>' +
                            pendingHtml +
                            '<div class="defi-card-actions"><span class="defi-card-detail">' + data.positions + ' position' + (data.positions !== 1 ? 's' : '') + '</span>' +
                            '<div class="defi-card-links">' + (rewardsUrl ? '<a href="' + escapeAttr(rewardsUrl) + '" target="_blank" rel="noopener" class="defi-action-link">Rewards</a>' : '') + '</div></div></div>';

                        allDefiRows.push({ protocol: protocol, token: token, type: 'DePIN', amount: data.amount, value: usdValue, chain: stakingChain });
                    });
                });

                html += '</div></div>'; // close grid + section
            }

            // ========================================
            // SECTION 2B: LENDING POSITIONS (All Chains)
            // ========================================
            var lendingPositions = lendingData ? (lendingData.lending_positions || []) : [];
            var supplyPositions = lendingPositions.filter(function(p) { return p.position_type === 'lending_supply'; });
            var borrowPositions = lendingPositions.filter(function(p) { return p.position_type === 'lending_borrow'; });
            var lendingOnlyCount = supplyPositions.length + borrowPositions.length;

            if (lendingOnlyCount > 0) {
                html += '<div class="defi-section"><div class="defi-section-header">' +
                    '<span class="defi-section-icon">&#127974;</span>' +
                    '<span class="defi-section-title">Lending & Borrowing</span>' +
                    '<span class="defi-section-count">' + lendingOnlyCount + '</span>' +
                    '</div><div class="defi-card-grid">';

                // Supply positions
                supplyPositions.forEach(function(pos) {
                    var underlying = (pos.extra && pos.extra.underlying_token) ? pos.extra.underlying_token : pos.token_symbol;
                    var tokenPrice = getTokenPrice(underlying);
                    var amount = parseFloat(pos.amount) || 0;
                    var usdValue = parseFloat(pos.value_usd) || (amount * tokenPrice);
                    totalStakedValue += usdValue;
                    stakedCount++;
                    protocolSet.add(pos.protocol);

                    var posChain = pos.chain || 'cardano';
                    var apyBadge = '';
                    if (pos.apy && parseFloat(pos.apy) > 0) {
                        apyBadge = '<span class="defi-badge defi-badge-apy">' + parseFloat(pos.apy).toFixed(2) + '% APY</span>';
                    }
                    var sourceNote = (pos.extra && pos.extra.source === 'api') ? '' : (pos.extra && pos.extra.note ? ' <span style="font-size:10px;color:var(--v2-text-muted)">(est.)</span>' : '');

                    // Pending rewards (COMP, etc.)
                    var rewardHtml = '';
                    var pendingRewards = parseFloat(pos.pending_rewards) || 0;
                    var rewardToken = pos.reward_token || '';
                    if (pendingRewards > 0 && rewardToken) {
                        rewardHtml = '<div class="defi-card-pending"><div class="defi-pending-label">Pending</div>' +
                            '<div class="defi-pending-row"><span class="defi-pending-amount">' + pendingRewards.toFixed(4) + ' ' + escapeHtml(rewardToken) + '</span></div></div>';
                    }

                    html += '<div class="defi-card lending-supply" data-protocol="' + escapeAttr(pos.protocol) + '">' +
                        '<div class="defi-card-header">' +
                        logoImgHtml(underlying, null, 32) +
                        '<span class="defi-card-protocol">' + getChainBadge(posChain) + ' ' + escapeHtml(pos.protocol) + '</span>' +
                        '<div class="defi-card-badges"><span class="defi-badge defi-badge-supply">Supply</span>' + apyBadge + '</div>' +
                        '</div>' +
                        '<div class="defi-card-amount v2-blur">' + amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 6}) + ' <span style="font-size:14px;font-weight:400">' + escapeHtml(pos.token_symbol) + '</span>' + sourceNote + '</div>' +
                        '<div class="defi-card-token">' + escapeHtml(pos.token_name || '') + '</div>' +
                        (usdValue > 0 ? '<div class="defi-card-value v2-blur">' + formatCurrency(usdValue) + '</div>' : '') +
                        rewardHtml +
                        '<div class="defi-card-actions">' +
                        '<span class="defi-card-detail">Underlying: ' + escapeHtml(underlying) + '</span>' +
                        '<div class="defi-card-links">' +
                        '<a href="' + escapeAttr(getLendingProtocolUrl(pos.protocol)) + '" target="_blank" rel="noopener" class="defi-action-link">Manage</a>' +
                        '</div></div></div>';

                    allDefiRows.push({ protocol: pos.protocol, token: pos.token_symbol, type: 'Supply', amount: amount, value: usdValue, chain: posChain });
                });

                // Borrow positions
                borrowPositions.forEach(function(pos) {
                    var underlying = (pos.extra && pos.extra.underlying_token) ? pos.extra.underlying_token : pos.token_symbol;
                    var tokenPrice = getTokenPrice(underlying);
                    var amount = parseFloat(pos.amount) || 0;
                    var usdValue = parseFloat(pos.value_usd) || (amount * tokenPrice);
                    stakedCount++;
                    protocolSet.add(pos.protocol);

                    var posChain = pos.chain || 'cardano';
                    var healthFactor = pos.extra ? pos.extra.health_factor : null;
                    var healthHtml = '';
                    if (healthFactor !== null && healthFactor !== undefined) {
                        var hf = parseFloat(healthFactor);
                        var hfClass = hf >= 2 ? 'healthy' : (hf >= 1.2 ? 'warning' : 'danger');
                        healthHtml = '<span class="health-factor ' + hfClass + '">HF ' + hf.toFixed(2) + '</span>';
                    }

                    var apyBadge = '';
                    if (pos.apy && parseFloat(pos.apy) > 0) {
                        apyBadge = '<span class="defi-badge defi-badge-apy" style="background:#ef4444;color:#fff">' + parseFloat(pos.apy).toFixed(2) + '% APR</span>';
                    }

                    html += '<div class="defi-card lending-borrow" data-protocol="' + escapeAttr(pos.protocol) + '">' +
                        '<div class="defi-card-header">' +
                        logoImgHtml(underlying, null, 32) +
                        '<span class="defi-card-protocol">' + getChainBadge(posChain) + ' ' + escapeHtml(pos.protocol) + '</span>' +
                        '<div class="defi-card-badges"><span class="defi-badge defi-badge-borrow">Borrow</span>' + apyBadge + '</div>' +
                        '</div>' +
                        '<div class="defi-card-amount v2-blur">' + amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 6}) + ' <span style="font-size:14px;font-weight:400">' + escapeHtml(pos.token_symbol) + '</span></div>' +
                        '<div class="defi-card-token">' + escapeHtml(pos.token_name || '') + '</div>' +
                        (usdValue > 0 ? '<div class="defi-card-value v2-blur" style="color:#ef4444">-' + formatCurrency(usdValue) + ' (debt)</div>' : '') +
                        (healthHtml ? '<div style="margin-top:6px">' + healthHtml + '</div>' : '') +
                        '<div class="defi-card-actions">' +
                        '<span class="defi-card-detail">' + escapeHtml(pos.token_name || 'Active Loan') + '</span>' +
                        '<div class="defi-card-links">' +
                        '<a href="' + escapeAttr(getLendingProtocolUrl(pos.protocol)) + '" target="_blank" rel="noopener" class="defi-action-link">Manage</a>' +
                        '</div></div></div>';

                    allDefiRows.push({ protocol: pos.protocol, token: pos.token_symbol, type: 'Borrow', amount: amount, value: usdValue, chain: posChain });
                });

                html += '</div></div>'; // close grid + section
            }

            // ========================================
            // SECTION 2C: PERPETUAL POSITIONS
            // ========================================
            var perpPositions = lendingData ? (lendingData.perp_positions || []) : [];
            if (perpPositions.length === 0) {
                perpPositions = lendingPositions.filter(function(p) { return p.position_type === 'perpetuals'; });
            }

            if (perpPositions.length > 0) {
                html += '<div class="defi-section"><div class="defi-section-header">' +
                    '<span class="defi-section-icon">&#128200;</span>' +
                    '<span class="defi-section-title">Perpetual Positions</span>' +
                    '<span class="defi-section-count">' + perpPositions.length + '</span>' +
                    '</div><div class="defi-card-grid">';

                perpPositions.forEach(function(pos) {
                    var amount = parseFloat(pos.amount) || 0;
                    var sizeUsd = parseFloat(pos.extra && pos.extra.size_usd ? pos.extra.size_usd : pos.value_usd) || 0;
                    var pnl = parseFloat(pos.extra ? pos.extra.pnl : 0) || 0;
                    var side = pos.extra ? (pos.extra.side || '') : '';
                    var entryPrice = parseFloat(pos.extra ? pos.extra.entry_price : 0) || 0;
                    var leverage = parseFloat(pos.extra ? pos.extra.leverage : 0) || 0;
                    var collateral = parseFloat(pos.extra ? pos.extra.collateral_usd : 0) || 0;
                    var liqPrice = parseFloat(pos.extra ? pos.extra.liquidation_price : 0) || 0;
                    var posChain = pos.chain || 'solana';
                    protocolSet.add(pos.protocol);
                    stakedCount++;

                    var sideColor = side === 'long' ? '#10b981' : (side === 'short' ? '#ef4444' : 'var(--v2-accent,#00d26a)');
                    var sideLabel = side ? side.charAt(0).toUpperCase() + side.slice(1) : 'Position';
                    var pnlColor = pnl >= 0 ? '#10b981' : '#ef4444';
                    var pnlSign = pnl >= 0 ? '+' : '';
                    var tokenBase = pos.token_symbol ? pos.token_symbol.replace('-PERP', '').replace('-perp', '') : 'UNKNOWN';

                    var pnlHtml = pnl !== 0 ? '<div style="font-size:16px;font-weight:700;color:' + pnlColor + ';margin-top:4px;font-family:var(--v2-font-mono)">' + pnlSign + formatCurrency(Math.abs(pnl)) + '</div>' : '';

                    var detailParts = [];
                    if (entryPrice > 0) detailParts.push('Entry: $' + entryPrice.toLocaleString(undefined, {maximumFractionDigits: 2}));
                    if (leverage > 0) detailParts.push(leverage.toFixed(1) + 'x');
                    if (collateral > 0) detailParts.push('Collateral: ' + formatCurrency(collateral));

                    html += '<div class="defi-card" style="border-left-color:' + sideColor + '" data-protocol="' + escapeAttr(pos.protocol) + '">' +
                        '<div class="defi-card-header">' +
                        logoImgHtml(tokenBase, null, 32) +
                        '<span class="defi-card-protocol">' + getChainBadge(posChain) + ' ' + escapeHtml(pos.protocol) + '</span>' +
                        '<div class="defi-card-badges"><span class="defi-badge" style="background:' + sideColor + ';color:#fff">' + escapeHtml(sideLabel) + '</span></div>' +
                        '</div>' +
                        '<div class="defi-card-amount">' + escapeHtml(pos.token_symbol || 'Position') + '</div>' +
                        (sizeUsd > 0 ? '<div class="defi-card-value v2-blur">Size: ' + formatCurrency(sizeUsd) + '</div>' : '') +
                        pnlHtml +
                        (detailParts.length > 0 ? '<div class="defi-card-actions"><span class="defi-card-detail">' + escapeHtml(detailParts.join(' · ')) + '</span></div>' : '') +
                        (liqPrice > 0 ? '<div style="font-size:11px;color:#ef4444;margin-top:4px">Liq: $' + liqPrice.toLocaleString(undefined, {maximumFractionDigits: 2}) + '</div>' : '') +
                        '</div>';

                    allDefiRows.push({ protocol: pos.protocol, token: pos.token_symbol, type: side ? side.charAt(0).toUpperCase() + side.slice(1) : 'Perp', amount: amount, value: sizeUsd, chain: posChain });
                });

                html += '</div></div>'; // close grid + section
            }

            // ========================================
            // SECTION 2D: LP POSITIONS (All Chains)
            // ========================================
            var solanaLpPositions = lendingData ? (lendingData.lp_positions || []) : [];
            if (solanaLpPositions.length === 0) {
                solanaLpPositions = lendingPositions.filter(function(p) { return p.position_type === 'lp_position' || p.position_type === 'concentrated_lp'; });
            }

            if (solanaLpPositions.length > 0) {
                var totalSolLpVal = solanaLpPositions.reduce(function(sum, p) { return sum + (parseFloat(p.value_usd) || 0); }, 0);

                html += '<div class="defi-section"><div class="defi-section-header">' +
                    '<span class="defi-section-icon">&#128177;</span>' +
                    '<span class="defi-section-title">LP Positions</span>' +
                    '<span class="defi-section-count">' + solanaLpPositions.length + ' pool' + (solanaLpPositions.length !== 1 ? 's' : '') + '</span>' +
                    (totalSolLpVal > 0 ? '<span style="margin-left:auto;font-family:var(--v2-font-mono);font-weight:700;color:var(--v2-accent,#00d26a)" class="v2-blur">' + formatCurrency(totalSolLpVal) + '</span>' : '') +
                    '</div><div class="defi-card-grid">';

                solanaLpPositions.forEach(function(pos) {
                    var pairName = (pos.extra && pos.extra.pair) ? pos.extra.pair : (pos.token_name || pos.token_symbol || 'LP');
                    var valueUsd = parseFloat(pos.value_usd) || 0;
                    var underlying = pos.underlying_tokens || [];
                    var tokenA = underlying[0] || null;
                    var tokenB = underlying[1] || null;
                    var inRange = pos.extra ? pos.extra.in_range : null;
                    var fees = pos.extra ? parseFloat(pos.extra.unclaimed_fees_usd || 0) : 0;
                    var posChain = pos.chain || 'solana';
                    var isConcentrated = pos.position_type === 'concentrated_lp';
                    protocolSet.add(pos.protocol);
                    stakedCount++;
                    totalStakedValue += valueUsd;

                    var protocolColors = { 'Orca': '#FFD700', 'Raydium': '#6366f1', 'Meteora': '#06b6d4', 'Uniswap v3': '#ff007a', 'Curve': '#a5a4ce', 'Balancer': '#1e1e2f' };
                    var borderColor = protocolColors[pos.protocol] || '#06b6d4';

                    var feeTierLabel = (pos.extra && pos.extra.fee_tier_label) ? pos.extra.fee_tier_label : '';
                    var pendingRewards = parseFloat(pos.pending_rewards) || 0;
                    var rewardToken = pos.reward_token || '';

                    var rangeHtml = '';
                    if (inRange !== null && inRange !== undefined) {
                        rangeHtml = inRange
                            ? '<span class="defi-badge" style="background:rgba(16,185,129,0.15);color:#10b981">In Range</span>'
                            : '<span class="defi-badge" style="background:rgba(239,68,68,0.15);color:#ef4444">Out of Range</span>';
                    }

                    var feeTierHtml = '';
                    if (feeTierLabel) {
                        feeTierHtml = '<span class="defi-badge" style="background:rgba(6,182,212,0.15);color:#06b6d4">' + escapeHtml(feeTierLabel) + '</span>';
                    }

                    html += '<div class="defi-card" style="border-left-color:' + borderColor + '" data-protocol="' + escapeAttr(pos.protocol) + '">' +
                        '<div class="defi-card-header">' +
                        '<span class="defi-card-protocol">' + getChainBadge(posChain) + ' ' + escapeHtml(pos.protocol) + '</span>' +
                        '<div class="defi-card-badges"><span class="defi-badge defi-badge-staked">' + (isConcentrated ? 'CL' : 'LP') + '</span>' + feeTierHtml + rangeHtml + '</div>' +
                        '</div>' +
                        '<div style="font-weight:700;font-size:15px;color:var(--v2-text-heading)">' + escapeHtml(pairName) + '</div>';

                    if (valueUsd > 0) {
                        html += '<div class="defi-card-amount v2-blur">' + formatCurrency(valueUsd) + '</div>';
                    } else {
                        html += '<div style="font-size:13px;color:var(--v2-text-muted);font-style:italic">Valuation pending...</div>';
                    }

                    // Underlying tokens breakdown
                    if (tokenA || tokenB) {
                        html += '<div style="margin-top:8px;padding:8px 10px;background:rgba(255,255,255,0.03);border-radius:8px;font-size:13px">';
                        if (tokenA) {
                            html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">' +
                                '<span style="font-weight:600;min-width:50px;color:var(--v2-text-primary)">' + escapeHtml(tokenA.symbol || '') + '</span>' +
                                '<span style="font-family:var(--v2-font-mono);color:var(--v2-text-secondary);flex:1" class="v2-blur">' + parseFloat(tokenA.amount || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 6}) + '</span>' +
                                (parseFloat(tokenA.value_usd) > 0 ? '<span style="font-family:var(--v2-font-mono);color:var(--v2-accent,#00d26a);font-size:12px" class="v2-blur">' + formatCurrency(parseFloat(tokenA.value_usd)) + '</span>' : '') +
                                '</div>';
                        }
                        if (tokenB) {
                            html += '<div style="display:flex;align-items:center;gap:8px">' +
                                '<span style="font-weight:600;min-width:50px;color:var(--v2-text-primary)">' + escapeHtml(tokenB.symbol || '') + '</span>' +
                                '<span style="font-family:var(--v2-font-mono);color:var(--v2-text-secondary);flex:1" class="v2-blur">' + parseFloat(tokenB.amount || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 6}) + '</span>' +
                                (parseFloat(tokenB.value_usd) > 0 ? '<span style="font-family:var(--v2-font-mono);color:var(--v2-accent,#00d26a);font-size:12px" class="v2-blur">' + formatCurrency(parseFloat(tokenB.value_usd)) + '</span>' : '') +
                                '</div>';
                        }
                        html += '</div>';
                    }

                    if (fees > 0) {
                        html += '<div class="defi-card-pending"><div class="defi-pending-label">Unclaimed Fees</div>' +
                            '<div class="defi-pending-row"><span class="defi-pending-amount v2-blur">' + formatCurrency(fees) + '</span></div></div>';
                    }

                    // Uncollected fees from Uniswap v3 enrichment (per-token)
                    if (pos.extra && pos.extra.uncollected_fees) {
                        var uf = pos.extra.uncollected_fees;
                        var feeEntries = Object.keys(uf).filter(function(k) { return parseFloat(uf[k]) > 0; });
                        if (feeEntries.length > 0) {
                            html += '<div class="defi-card-pending"><div class="defi-pending-label">Uncollected</div>' +
                                '<div class="defi-pending-row"><span class="defi-pending-amount">' +
                                feeEntries.map(function(k) { return parseFloat(uf[k]).toFixed(6) + ' ' + escapeHtml(k); }).join(', ') +
                                '</span></div></div>';
                        }
                    }

                    // Pending rewards (CRV, BAL, etc.)
                    if (pendingRewards > 0 && rewardToken) {
                        html += '<div class="defi-card-pending"><div class="defi-pending-label">Pending Rewards</div>' +
                            '<div class="defi-pending-row"><span class="defi-pending-amount">' + pendingRewards.toFixed(4) + ' ' + escapeHtml(rewardToken) + '</span></div></div>';
                    }

                    html += '<div class="defi-card-actions"><span class="defi-card-detail">' + escapeHtml(pos.protocol) + ' ' + (isConcentrated ? 'Concentrated' : 'Standard') + ' LP</span></div></div>';

                    allDefiRows.push({ protocol: pos.protocol, token: pairName, type: isConcentrated ? 'Concentrated LP' : 'LP Position', amount: parseFloat(pos.amount) || 0, value: valueUsd, chain: posChain });
                });

                html += '</div></div>'; // close grid + section
            }

            // ========================================
            // SECTION 2E: CDP / VAULT POSITIONS
            // ========================================
            var cdpPositions = lendingData ? (lendingData.cdp_positions || []) : [];
            var vaultPositions = lendingData ? (lendingData.vault_positions || []) : [];
            var cdpAndVault = cdpPositions.concat(vaultPositions);

            if (cdpAndVault.length > 0) {
                html += '<div class="defi-section"><div class="defi-section-header">' +
                    '<span class="defi-section-icon">&#127974;</span>' +
                    '<span class="defi-section-title">Vaults & CDPs</span>' +
                    '<span class="defi-section-count">' + cdpAndVault.length + '</span>' +
                    '</div><div class="defi-card-grid">';

                cdpAndVault.forEach(function(pos) {
                    var underlying = (pos.extra && pos.extra.collateral_token) ? pos.extra.collateral_token : ((pos.extra && pos.extra.underlying_token) ? pos.extra.underlying_token : pos.token_symbol);
                    var amount = parseFloat(pos.amount) || 0;
                    var usdValue = parseFloat(pos.value_usd) || 0;
                    var posChain = pos.chain || 'ethereum';
                    protocolSet.add(pos.protocol);
                    stakedCount++;
                    totalStakedValue += usdValue;

                    var isCDP = pos.position_type === 'cdp';
                    var badgeColor = isCDP ? '#8b5cf6' : '#10b981';
                    var badgeLabel = isCDP ? 'CDP' : 'Vault';

                    var detailHtml = '';
                    if (isCDP && pos.extra) {
                        var cr = pos.extra.collateral_ratio;
                        var debt = pos.extra.debt_dai;
                        if (cr !== null && cr !== undefined) {
                            var crClass = parseFloat(cr) >= 200 ? 'healthy' : (parseFloat(cr) >= 150 ? 'warning' : 'danger');
                            detailHtml += '<div style="margin-top:6px"><span class="health-factor ' + crClass + '">CR ' + parseFloat(cr).toFixed(1) + '%</span></div>';
                        }
                        if (debt > 0) {
                            detailHtml += '<div style="font-size:12px;color:#ef4444;margin-top:2px">Debt: ' + parseFloat(debt).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' DAI</div>';
                        }
                    }

                    html += '<div class="defi-card" style="border-left-color:' + badgeColor + '" data-protocol="' + escapeAttr(pos.protocol) + '">' +
                        '<div class="defi-card-header">' +
                        logoImgHtml(underlying, null, 32) +
                        '<span class="defi-card-protocol">' + getChainBadge(posChain) + ' ' + escapeHtml(pos.protocol) + '</span>' +
                        '<div class="defi-card-badges"><span class="defi-badge" style="background:' + badgeColor + ';color:#fff">' + badgeLabel + '</span></div>' +
                        '</div>' +
                        '<div class="defi-card-amount v2-blur">' + amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 6}) + ' <span style="font-size:14px;font-weight:400">' + escapeHtml(pos.token_symbol) + '</span></div>' +
                        '<div class="defi-card-token">' + escapeHtml(pos.token_name || '') + '</div>' +
                        (usdValue > 0 ? '<div class="defi-card-value v2-blur">' + formatCurrency(usdValue) + '</div>' : '') +
                        detailHtml +
                        '<div class="defi-card-actions">' +
                        '<span class="defi-card-detail">' + escapeHtml(underlying) + '</span>' +
                        '<div class="defi-card-links">' +
                        '<a href="' + escapeAttr(getLendingProtocolUrl(pos.protocol)) + '" target="_blank" rel="noopener" class="defi-action-link">Manage</a>' +
                        '</div></div></div>';

                    allDefiRows.push({ protocol: pos.protocol, token: pos.token_symbol, type: badgeLabel, amount: amount, value: usdValue, chain: posChain });
                });

                html += '</div></div>'; // close grid + section
            }

            // ========================================
            // SECTION 3: STABLECOINS
            // ========================================
            var walletStablecoins = positions['Stablecoins'] || [];
            var MIN_STABLE_VALUE = 1.00;
            var stableTotals = {};

            // Cardano stablecoins
            walletStablecoins.forEach(function(pos) {
                if (!stableTotals[pos.asset_name]) stableTotals[pos.asset_name] = { chains: {} };
                if (!stableTotals[pos.asset_name].chains.cardano) stableTotals[pos.asset_name].chains.cardano = 0;
                stableTotals[pos.asset_name].chains.cardano += parseFloat(pos.quantity) || 0;
            });

            // Exchange stablecoins
            exchangeStablecoins.forEach(function(a) {
                if (!stableTotals[a.symbol]) stableTotals[a.symbol] = { chains: {} };
                if (!stableTotals[a.symbol].chains.exchange) stableTotals[a.symbol].chains.exchange = 0;
                stableTotals[a.symbol].chains.exchange += parseFloat(a.balance) || 0;
            });

            // Native stablecoins from other chains
            nativeStablecoins.forEach(function(a) {
                var chain = a.chain || 'cardano';
                if (chain === 'cardano') return;
                if (!stableTotals[a.symbol]) stableTotals[a.symbol] = { chains: {} };
                if (!stableTotals[a.symbol].chains[chain]) stableTotals[a.symbol].chains[chain] = 0;
                stableTotals[a.symbol].chains[chain] += parseFloat(a.balance) || 0;
            });

            var stableKeys = Object.keys(stableTotals);
            if (stableKeys.length > 0) {
                var stableEntries = stableKeys.map(function(symbol) {
                    var chains = stableTotals[symbol].chains;
                    var total = 0;
                    Object.keys(chains).forEach(function(c) { total += chains[c]; });
                    return { symbol: symbol, chains: chains, total: total };
                }).filter(function(s) { return s.total >= 0.01; }).sort(function(a, b) { return b.total - a.total; });

                var visibleStables = [];
                var hiddenStables = [];
                stableEntries.forEach(function(s) {
                    if (s.total >= MIN_STABLE_VALUE) { visibleStables.push(s); totalStableValue += s.total; }
                    else { hiddenStables.push(s); }
                });

                if (visibleStables.length > 0 || hiddenStables.length > 0) {
                    html += '<div class="defi-section"><div class="defi-section-header">' +
                        '<span class="defi-section-icon">&#128176;</span>' +
                        '<span class="defi-section-title">Stablecoins</span>' +
                        '<span class="defi-section-count">' + stableEntries.length + '</span>' +
                        '</div><div>';

                    visibleStables.forEach(function(s) {
                        var chainBadges = Object.keys(s.chains).filter(function(c) { return s.chains[c] > 0; }).map(function(c) { return getChainBadge(c); }).join('');
                        html += '<div class="defi-gov-line">' +
                            '<div class="line-logo"><img src="' + escapeAttr(getLogoKitUrl(s.symbol, 28)) + '" alt="' + escapeAttr(s.symbol) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><span class="logo-fallback" style="display:none">' + escapeHtml(s.symbol.substring(0, 3)) + '</span></div>' +
                            '<span class="line-token">' + escapeHtml(s.symbol) + '</span>' +
                            '<span class="line-chains">' + chainBadges + '</span>' +
                            '<span class="line-amount v2-blur">' + s.total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '</span>' +
                            '<span class="line-value v2-blur">~' + formatCurrency(s.total) + '</span></div>';
                        allDefiRows.push({ protocol: 'Stablecoins', token: s.symbol, type: 'Stablecoin', amount: s.total, value: s.total, chain: 'multi' });
                    });

                    if (visibleStables.length === 0) {
                        html += '<div style="padding:8px 0;font-size:13px;color:var(--v2-text-muted)">No stablecoins over $1.00</div>';
                    }

                    if (hiddenStables.length > 0) {
                        var hiddenTotal = hiddenStables.reduce(function(sum, s) { return sum + s.total; }, 0);
                        html += '<button class="hidden-stables-toggle" id="hiddenStablesBtn">' +
                            '<span class="toggle-icon">&#9654;</span>' +
                            '<span>Hidden (' + hiddenStables.length + ')</span>' +
                            '<span style="margin-left:auto;font-family:var(--v2-font-mono)">~' + formatCurrency(hiddenTotal) + '</span></button>' +
                            '<div id="hiddenStablesContent" style="display:none">';
                        hiddenStables.forEach(function(s) {
                            var chainBadges = Object.keys(s.chains).filter(function(c) { return s.chains[c] > 0; }).map(function(c) { return getChainBadge(c); }).join('');
                            html += '<div class="defi-gov-line" style="opacity:0.7">' +
                                '<div class="line-logo"><img src="' + escapeAttr(getLogoKitUrl(s.symbol, 28)) + '" alt="' + escapeAttr(s.symbol) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><span class="logo-fallback" style="display:none">' + escapeHtml(s.symbol.substring(0, 3)) + '</span></div>' +
                                '<span class="line-token">' + escapeHtml(s.symbol) + '</span>' +
                                '<span class="line-chains">' + chainBadges + '</span>' +
                                '<span class="line-amount v2-blur">' + s.total.toLocaleString(undefined, {minimumFractionDigits: 4, maximumFractionDigits: 6}) + '</span>' +
                                '<span class="line-value v2-blur">~' + formatCurrency(s.total) + '</span></div>';
                        });
                        html += '</div>';
                    }

                    html += '</div></div>'; // close section
                }
            }

            // ========================================
            // SECTION 4: GOVERNANCE TOKENS
            // ========================================
            if (governancePositions.length > 0) {
                // Sort by value descending
                governancePositions.sort(function(a, b) { return (parseFloat(b.quantity) || 0) * getTokenPrice(b.asset_name) - (parseFloat(a.quantity) || 0) * getTokenPrice(a.asset_name); });

                html += '<div class="defi-section"><div class="defi-section-header">' +
                    '<span class="defi-section-icon">&#127963;</span>' +
                    '<span class="defi-section-title">Governance Tokens</span>' +
                    '<span class="defi-section-count">' + governancePositions.length + '</span>' +
                    '</div><div>';

                governancePositions.forEach(function(pos) {
                    var token = pos.asset_name || pos.token;
                    var qty = parseFloat(pos.quantity) || 0;
                    var price = getTokenPrice(token);
                    var usdVal = qty * price;
                    var govLink = GOVERNANCE_LINKS[token];
                    var logoUrl = pos.logo_url || getLogoKitUrl(token, 28);

                    html += '<div class="defi-gov-line">' +
                        '<div class="line-logo"><img src="' + escapeAttr(logoUrl) + '" alt="' + escapeAttr(token) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><span class="logo-fallback" style="display:none">' + escapeHtml(token.substring(0, 3)) + '</span></div>' +
                        '<span class="line-token">' + escapeHtml(token) + '</span>' +
                        '<span class="line-amount v2-blur">' + (pos.quantity_formatted || formatAmount(qty)) + '</span>' +
                        (usdVal > 0 ? '<span class="line-value v2-blur">' + formatCurrency(usdVal) + '</span>' : '<span class="line-value" style="color:var(--v2-text-muted)">--</span>') +
                        (govLink ? '<span class="line-action"><a href="' + escapeAttr(govLink.url) + '" target="_blank" rel="noopener" class="defi-action-link gov-link" style="font-size:11px;padding:2px 8px">Vote</a></span>' : '') +
                        '</div>';

                    allDefiRows.push({ protocol: pos.protocol || 'Governance', token: token, type: 'Governance', amount: qty, value: usdVal, chain: 'cardano' });
                });

                html += '</div></div>'; // close section
            }

            // ========================================
            // SECTION 5: LP POSITIONS (RICH CARDS)
            // ========================================
            var lpPositions = positions['Liquidity Pool Tokens'] || [];
            if (lpPositions.length > 0) {
                var totalLpValue = lpPositions.reduce(function(sum, pos) { return sum + (parseFloat(pos.value_usd) || 0); }, 0);

                html += '<div class="defi-section"><div class="defi-section-header">' +
                    '<span class="defi-section-icon">&#128177;</span>' +
                    '<span class="defi-section-title">Liquidity Pool Positions</span>' +
                    '<span class="defi-section-count">' + lpPositions.length + ' pool' + (lpPositions.length !== 1 ? 's' : '') + '</span>' +
                    (totalLpValue > 0 ? '<span style="margin-left:auto;font-family:var(--v2-font-mono);font-weight:700;color:var(--v2-accent,#00d26a)" class="v2-blur">' + formatCurrency(totalLpValue) + '</span>' : '') +
                    '</div><div class="defi-card-grid">';

                lpPositions.forEach(function(pos) {
                    var pairName = pos.pair_name || pos.asset_name || pos.token || 'LP';
                    var valueUsd = parseFloat(pos.value_usd) || 0;
                    var poolShare = parseFloat(pos.pool_share_pct) || 0;
                    var underlying = pos.underlying_tokens || [];
                    var tokenA = underlying[0] || null;
                    var tokenB = underlying[1] || null;
                    var protocol = pos.protocol || 'DEX';

                    totalStakedValue += valueUsd;
                    stakedCount++;
                    protocolSet.add(protocol);

                    // Protocol-specific accent color
                    var protocolColors = { 'Minswap': '#6366f1', 'SundaeSwap': '#ec4899', 'WingRiders': '#3b82f6', 'Splash': '#06b6d4', 'MuesliSwap': '#f59e0b' };
                    var borderColor = protocolColors[protocol] || 'var(--v2-accent,#00d26a)';

                    html += '<div class="defi-card" style="border-left-color:' + borderColor + '" data-protocol="' + escapeAttr(protocol) + '">' +
                        '<div class="defi-card-header">' +
                        '<span class="defi-card-protocol">' + getChainBadge('cardano') + ' ' + escapeHtml(protocol) + '</span>' +
                        '<div class="defi-card-badges"><span class="defi-badge defi-badge-staked">LP</span></div>' +
                        '</div>' +
                        '<div style="font-weight:700;font-size:15px;color:var(--v2-text-heading)">' + escapeHtml(pairName) + '</div>';

                    if (valueUsd > 0) {
                        html += '<div class="defi-card-amount v2-blur">' + formatCurrency(valueUsd) + '</div>';
                    } else {
                        html += '<div style="font-size:13px;color:var(--v2-text-muted);font-style:italic">Valuation pending...</div>';
                    }

                    // Underlying tokens breakdown
                    if (tokenA || tokenB) {
                        html += '<div style="margin-top:8px;padding:8px 10px;background:rgba(255,255,255,0.03);border-radius:8px;font-size:13px">';
                        if (tokenA) {
                            html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">' +
                                '<span style="font-weight:600;min-width:50px;color:var(--v2-text-primary)">' + escapeHtml(tokenA.symbol || '') + '</span>' +
                                '<span style="font-family:var(--v2-font-mono);color:var(--v2-text-secondary);flex:1" class="v2-blur">' + parseFloat(tokenA.amount || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 6}) + '</span>' +
                                (parseFloat(tokenA.value_usd) > 0 ? '<span style="font-family:var(--v2-font-mono);color:var(--v2-accent,#00d26a);font-size:12px" class="v2-blur">' + formatCurrency(parseFloat(tokenA.value_usd)) + '</span>' : '') +
                                '</div>';
                        }
                        if (tokenB) {
                            html += '<div style="display:flex;align-items:center;gap:8px">' +
                                '<span style="font-weight:600;min-width:50px;color:var(--v2-text-primary)">' + escapeHtml(tokenB.symbol || '') + '</span>' +
                                '<span style="font-family:var(--v2-font-mono);color:var(--v2-text-secondary);flex:1" class="v2-blur">' + parseFloat(tokenB.amount || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 6}) + '</span>' +
                                (parseFloat(tokenB.value_usd) > 0 ? '<span style="font-family:var(--v2-font-mono);color:var(--v2-accent,#00d26a);font-size:12px" class="v2-blur">' + formatCurrency(parseFloat(tokenB.value_usd)) + '</span>' : '') +
                                '</div>';
                        }
                        html += '</div>';
                    }

                    // Footer with pool share
                    html += '<div class="defi-card-actions">';
                    if (poolShare > 0) {
                        html += '<span class="defi-card-detail" style="font-family:var(--v2-font-mono)">Pool share: ' + (poolShare < 0.0001 ? '&lt;0.0001' : poolShare.toFixed(4)) + '%</span>';
                    }
                    if (pos.wallet_count > 1) {
                        html += '<span class="defi-card-detail">In ' + pos.wallet_count + ' wallets</span>';
                    }
                    html += '</div></div>';

                    allDefiRows.push({ protocol: protocol, token: pairName, type: 'LP Position', amount: parseFloat(pos.quantity) || 0, value: valueUsd, chain: 'cardano' });
                });

                html += '</div></div>'; // close grid + section
            }

            // ========================================
            // SECTION 5B: OTHER DEFI TOKEN CATEGORIES
            // ========================================
            var otherCategories = ['Staking Receipts', 'Protocol Receipts', 'Synthetic Assets', 'Reserve Tokens'];
            var categoryIcons = {
                'Staking Receipts': '&#128196;',
                'Protocol Receipts': '&#128195;',
                'Synthetic Assets': '&#128181;',
                'Reserve Tokens': '&#127974;'
            };

            otherCategories.forEach(function(category) {
                var catPositions = positions[category] || [];
                if (catPositions.length === 0) return;

                html += '<div class="defi-section"><div class="defi-section-header">' +
                    '<span class="defi-section-icon">' + (categoryIcons[category] || '&#128202;') + '</span>' +
                    '<span class="defi-section-title">' + escapeHtml(category) + '</span>' +
                    '<span class="defi-section-count">' + catPositions.length + '</span>' +
                    '</div><div class="defi-token-chips">';

                catPositions.forEach(function(pos) {
                    var qty = parseFloat(pos.quantity) || 0;
                    var price = getTokenPrice(pos.asset_name || pos.token);
                    var usdVal = qty * price;

                    html += '<div class="defi-token-chip">' +
                        '<span class="chip-name">' + escapeHtml(pos.asset_name || pos.token) + '</span>' +
                        '<span class="chip-amount v2-blur">' + (pos.quantity_formatted || formatAmount(qty)) + '</span>' +
                        (usdVal > 0 ? '<span style="color:var(--v2-text-muted);font-size:12px" class="v2-blur">' + formatCurrency(usdVal) + '</span>' : '') +
                        '</div>';

                    allDefiRows.push({ protocol: pos.protocol || category, token: pos.asset_name || pos.token, type: category, amount: qty, value: usdVal, chain: 'cardano' });
                });

                html += '</div></div>'; // close section
            });

            // ========================================
            // SECTION 6: DEFI HOLDINGS FROM ALL-HOLDINGS
            // ========================================
            var allHoldings = holdingsData ? (holdingsData.holdings || []) : [];
            var defiHoldings = allHoldings.filter(function(h) { return h.source === 'defi' || h.source === 'defi_summary'; });

            // Filter out tokens already shown in governance or other sections
            var shownTokens = new Set();
            allDefiRows.forEach(function(r) { shownTokens.add(r.token.toUpperCase()); });

            var uniqueDefiHoldings = defiHoldings.filter(function(h) {
                return !shownTokens.has((h.symbol || h.name || '').toUpperCase());
            });

            if (uniqueDefiHoldings.length > 0) {
                var defiHoldTotal = uniqueDefiHoldings.reduce(function(sum, h) { return sum + (parseFloat(h.value_usd) || 0); }, 0);
                html += '<div class="defi-section"><div class="defi-section-header">' +
                    '<span class="defi-section-icon">&#127981;</span>' +
                    '<span class="defi-section-title">Other DeFi Holdings</span>' +
                    '<span class="defi-section-count">' + uniqueDefiHoldings.length + '</span>' +
                    '</div><div class="defi-token-chips">';

                uniqueDefiHoldings.forEach(function(h) {
                    var amount = parseFloat(h.amount) || 0;
                    var valueUsd = parseFloat(h.value_usd) || 0;
                    html += '<div class="defi-token-chip">' +
                        '<span class="chip-name">' + escapeHtml(h.symbol || h.name || 'Token') + '</span>' +
                        '<span class="chip-amount v2-blur">' + formatAmount(amount) + '</span>' +
                        (valueUsd > 0 ? '<span style="color:var(--v2-text-muted);font-size:12px" class="v2-blur">' + formatCurrency(valueUsd) + '</span>' : '') +
                        '</div>';
                    allDefiRows.push({ protocol: 'DeFi Holdings', token: h.symbol || h.name || 'Token', type: 'Holding', amount: amount, value: valueUsd, chain: h.blockchain || 'cardano' });
                });

                html += '</div></div>';
            }

            // ========================================
            // EMPTY STATE
            // ========================================
            if (html === '') {
                html = '<div class="v2-empty" style="padding:64px;text-align:center"><div class="v2-empty-icon" style="font-size:48px;opacity:0.2">&#127981;</div><div class="v2-empty-title">No DeFi positions detected</div><div class="v2-empty-desc">DeFi positions and staking are auto-detected from your wallet addresses. Add wallets to see positions here.</div></div>';
            }

            setSafeHTML(document.getElementById('defiSections'), html);

            // ========================================
            // UPDATE SUMMARY STATS
            // ========================================
            var bd = instantData ? (instantData.breakdown || {}) : {};
            var instStaked = parseFloat(bd.staking) || 0;
            var instDefi = parseFloat(bd.defi) || 0;
            var totalValue = Math.max(totalStakedValue + totalStableValue, instStaked + instDefi);

            setText('defiTotal', formatCurrency(totalValue + totalPendingValue));
            setText('stakedTotal', formatCurrency(totalStakedValue > 0 ? totalStakedValue : instStaked));
            setText('pendingTotal', totalPendingValue > 0 ? formatCurrency(totalPendingValue) : '$0.00');
            setText('protocolCount', protocolSet.size.toString());
            setText('positionCount', stakedCount.toString());

            // ========================================
            // ATTACH EVENT HANDLERS
            // ========================================
            // DePIN refresh buttons
            document.querySelectorAll('.defi-card-refresh[data-protocol]').forEach(function(btn) {
                btn.addEventListener('click', function() { refreshDepinCard(btn.dataset.protocol, btn); });
            });

            // Staking section refresh
            var stakingRefreshBtn = document.getElementById('stakingRefreshBtn');
            if (stakingRefreshBtn) {
                stakingRefreshBtn.addEventListener('click', function() { refreshDefi(true); });
            }

            // Hidden stables toggle
            var hiddenBtn = document.getElementById('hiddenStablesBtn');
            if (hiddenBtn) {
                hiddenBtn.addEventListener('click', function() {
                    var content = document.getElementById('hiddenStablesContent');
                    if (content) {
                        var showing = content.style.display !== 'none';
                        content.style.display = showing ? 'none' : '';
                        hiddenBtn.classList.toggle('open', !showing);
                    }
                });
            }

            // Logo fallbacks
            document.querySelectorAll('.defi-card-logo img').forEach(function(img) {
                img.addEventListener('error', function() {
                    this.style.display = 'none';
                    var fb = this.nextElementSibling;
                    if (fb) fb.style.display = 'flex';
                });
            });

            // Table view
            if (defiView === 'table') renderDefiTable();
        }

        /* ============================================================
           DEPIN CARD REFRESH
           ============================================================ */
        async function refreshDepinCard(protocol, btn) {
            if (btn) {
                btn.classList.add('refreshing');
                btn.disabled = true;
            }
            try {
                // Use dedicated protocol endpoints (like V1) for more reliable data
                var addresses = [];
                var endpointTemplate = '';
                if (protocol === 'Iagon') {
                    addresses = _walletAddresses.cardano || [];
                    endpointTemplate = '/defi/iagon/';
                } else if (protocol === 'Helium') {
                    addresses = _walletAddresses.solana || [];
                    endpointTemplate = '/defi/helium/';
                } else {
                    addresses = _walletAddresses.cardano || [];
                    endpointTemplate = '/defi/staking/';
                }

                // Fetch all wallets in parallel for this protocol
                var fetches = addresses.map(function(addr) {
                    return v2Fetch(endpointTemplate + addr + '?refresh=true')
                        .then(function(r) { return r.ok ? r.json() : null; })
                        .catch(function() { return null; });
                });
                var results = await Promise.all(fetches);

                // Aggregate results across wallets
                var totalAmount = 0, pendingRewards = 0;
                var rewardToken = '', rewardsUrl = '', token = '', logoUrl = '', blockchain = '';
                var hasData = false;
                var totalPositions = 0;

                results.forEach(function(data) {
                    if (!data || !data.protocols || !data.protocols[protocol]) return;
                    hasData = true;
                    var pData = data.protocols[protocol];
                    rewardToken = pData.reward_token || rewardToken;
                    rewardsUrl = pData.rewards_url || rewardsUrl;
                    blockchain = pData.blockchain || blockchain;
                    pendingRewards += parseFloat(pData.pending_rewards) || 0;

                    (pData.staked || []).forEach(function(stake) {
                        token = stake.token || token;
                        totalAmount += parseFloat(stake.amount) || 0;
                        totalPositions += (stake.positions || 0);
                        logoUrl = stake.logo_url || logoUrl;
                    });
                });

                // Update the card in-place without full page re-render
                var cardEl = document.getElementById('depin-card-' + protocol);
                if (hasData && cardEl) {
                    var tokenPrice = getTokenPrice(token);
                    var usdValue = totalAmount * tokenPrice;
                    var pendingHtml = '';
                    if (pendingRewards > 0 && rewardToken) {
                        var rewPrice = getTokenPrice(rewardToken);
                        var pendUsd = pendingRewards * rewPrice;
                        pendingHtml = '<div class="defi-card-pending"><div class="defi-pending-label">Pending</div>' +
                            '<div class="defi-pending-row"><span class="defi-pending-amount v2-blur">' + pendingRewards.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4}) + ' ' + escapeHtml(rewardToken) + '</span>' +
                            (pendUsd > 0 ? '<span class="defi-pending-usd v2-blur">' + formatCurrency(pendUsd) + '</span>' : '') + '</div></div>';
                    }

                    var refreshBtnHtml = '<button class="defi-card-refresh" data-protocol="' + escapeAttr(protocol) + '" title="Refresh ' + escapeAttr(protocol) + '">' + refreshSvg(12) + '</button>';
                    setSafeHTML(cardEl,
                        '<div class="defi-card-header">' + logoImgHtml(token, logoUrl, 32) +
                        '<span class="defi-card-protocol">' + getChainBadge(blockchain || 'cardano') + ' ' + escapeHtml(protocol) + '</span>' +
                        '<div class="defi-card-badges"><span class="defi-badge defi-badge-depin">DePIN</span></div>' +
                        refreshBtnHtml + '</div>' +
                        '<div class="defi-card-amount v2-blur">' + totalAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4}) + ' <span style="font-size:14px;font-weight:400">' + escapeHtml(token) + '</span></div>' +
                        '<div class="defi-card-value v2-blur">' + formatCurrency(usdValue) + '</div>' +
                        pendingHtml +
                        '<div class="defi-card-actions"><span class="defi-card-detail">' + totalPositions + ' position' + (totalPositions !== 1 ? 's' : '') + '</span>' +
                        '<div class="defi-card-links">' + (rewardsUrl ? '<a href="' + escapeAttr(rewardsUrl) + '" target="_blank" rel="noopener" class="defi-action-link">Rewards</a>' : '') + '</div></div>'
                    );
                    cardEl.className = 'defi-card';
                    cardEl.setAttribute('data-protocol', protocol);

                    // Re-attach refresh button event listener
                    var newBtn = cardEl.querySelector('.defi-card-refresh[data-protocol]');
                    if (newBtn) {
                        newBtn.addEventListener('click', function() { refreshDepinCard(protocol, newBtn); });
                    }

                    // Update localStorage cache with refreshed DePIN data
                    var cached = getCachedDefi();
                    if (cached && cached.allStaking) {
                        cached.allStaking[protocol] = {
                            staked: {},
                            pending_rewards: pendingRewards,
                            reward_token: rewardToken,
                            rewards_url: rewardsUrl,
                            blockchain: blockchain || 'cardano',
                            category: 'depin',
                            status: null,
                        };
                        if (token) {
                            cached.allStaking[protocol].staked[token] = { amount: totalAmount, positions: totalPositions, logo_url: logoUrl };
                        }
                        setCachedDefi(cached);
                    }

                    showToast(protocol + ' data refreshed', 'success');
                } else if (!hasData && cardEl) {
                    showToast(protocol + ' - no data found', 'info');
                }
            } catch (e) {
                console.error('[DePIN] Refresh error for ' + protocol + ':', e);
                showToast('Failed to refresh ' + protocol, 'error');
            } finally {
                if (btn) {
                    btn.classList.remove('refreshing');
                    btn.disabled = false;
                }
            }
        }

        /* ============================================================
           TABLE VIEW (preserved + enhanced)
           ============================================================ */
        function renderDefiTable() {
            var container = document.getElementById('defiTableView');
            if (!allDefiRows.length) {
                setSafeHTML(container, '<div class="v2-empty" style="padding:48px"><div class="v2-empty-title">No positions</div></div>');
                return;
            }

            var rows = allDefiRows.slice().sort(function(a, b) {
                var aVal, bVal;
                switch(defiSortCol) {
                    case 'protocol': aVal = a.protocol.toLowerCase(); bVal = b.protocol.toLowerCase(); break;
                    case 'token': aVal = a.token.toLowerCase(); bVal = b.token.toLowerCase(); break;
                    case 'type': aVal = a.type.toLowerCase(); bVal = b.type.toLowerCase(); break;
                    case 'amount': aVal = a.amount; bVal = b.amount; break;
                    case 'value': aVal = a.value; bVal = b.value; break;
                    default: aVal = 0; bVal = 0;
                }
                var cmp = typeof aVal === 'string' ? aVal.localeCompare(bVal) : aVal - bVal;
                return defiSortDir === 'asc' ? cmp : -cmp;
            });

            function sortTh(col, label, isRight) {
                var active = defiSortCol === col;
                var arrow = active ? (defiSortDir === 'asc' ? '&#9650;' : '&#9660;') : '';
                return '<th class="' + (isRight ? 'right ' : '') + 'sortable-header' + (active ? ' sorted' : '') + '" data-sort="' + col + '">' + label + ' <span class="sort-icon">' + arrow + '</span></th>';
            }

            var thtml = '<table class="v2-table"><thead><tr>' +
                sortTh('protocol', 'Protocol', false) +
                sortTh('token', 'Token', false) +
                sortTh('type', 'Type', false) +
                sortTh('amount', 'Quantity', true) +
                sortTh('value', 'Value (USD)', true) +
                '</tr></thead><tbody>';

            rows.forEach(function(r) {
                thtml += '<tr>' +
                    '<td><strong>' + escapeHtml(r.protocol) + '</strong></td>' +
                    '<td>' + escapeHtml(r.token) + '</td>' +
                    '<td>' + escapeHtml(r.type) + '</td>' +
                    '<td class="right v2-blur">' + formatAmount(r.amount) + '</td>' +
                    '<td class="right v2-blur">' + (r.value > 0 ? formatCurrency(r.value) : '<span style="color:var(--v2-text-muted);">--</span>') + '</td>' +
                    '</tr>';
            });
            thtml += '</tbody></table>';
            setSafeHTML(container, thtml);

            container.querySelectorAll('.sortable-header').forEach(function(th) {
                th.addEventListener('click', function() {
                    var col = th.dataset.sort;
                    if (defiSortCol === col) {
                        defiSortDir = defiSortDir === 'asc' ? 'desc' : 'asc';
                    } else {
                        defiSortCol = col;
                        defiSortDir = (col === 'protocol' || col === 'token' || col === 'type') ? 'asc' : 'desc';
                    }
                    renderDefiTable();
                });
            });
        }

        /* ============================================================
           REFRESH
           ============================================================ */
        async function refreshDefi(forceStaking) {
            // Clear cache so we fetch fresh data
            if (typeof V2_CACHE !== 'undefined') V2_CACHE.clearAll();
            showToast('Refreshing DeFi data...', 'success');
            try {
                if (forceStaking) {
                    // Refresh staking data for all wallets
                    var addresses = _walletAddresses.cardano || [];
                    for (var i = 0; i < addresses.length; i++) {
                        await v2Fetch('/defi/staking/' + addresses[i] + '?refresh=true');
                    }
                }
                await v2Fetch('/defi/summary?refresh=true');
                // Clear cache so loadDefi does a full render
                try { localStorage.removeItem(DEFI_CACHE_KEY); } catch(e) {}
                await loadDefi(true);
                showToast('DeFi data refreshed', 'success');
            } catch(e) { showToast('Refresh failed', 'error'); }
        }
    </script>
</body>
</html>
