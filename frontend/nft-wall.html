<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Wall - ABCT</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/css/styles.css?v=1769653325">
    <!-- Session-based authentication -->
    <script src="/static/js/session-auth.js?v=1769653325"></script>
    <style>
        /* NFT Wall Specific Styles */
        .wall-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .wall-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .wall-header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--text-primary);
        }

        .wall-header .back-link {
            color: var(--accent-success);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .wall-header .back-link:hover {
            text-decoration: underline;
        }

        .chain-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .chain-tab {
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chain-tab:hover {
            background: var(--bg-tertiary);
        }

        .chain-tab.active {
            background: var(--accent-success);
            color: #000;
            font-weight: 600;
        }

        .chain-tab .count {
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .chain-tab.active .count {
            background: rgba(0,0,0,0.3);
        }

        .chain-tab-value {
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: 2px solid var(--accent-success);
            border-radius: 8px;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-left: auto; /* Push to the right */
        }

        .chain-tab-value .value-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chain-tab-value .value-amount {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-success);
        }

        .nft-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .nft-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .nft-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .nft-card .image-container {
            width: 100%;
            aspect-ratio: 1;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .nft-card .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nft-card .image-container .loading {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .nft-card .image-container .no-image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: var(--bg-tertiary);
            padding: 20px;
            text-align: center;
        }

        .nft-card .image-container .no-image-placeholder .nft-text {
            font-size: 3rem;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }

        .nft-card .image-container .no-image-placeholder .no-cache-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .nft-card .nft-info {
            padding: 12px;
        }

        .nft-card .nft-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .nft-card .nft-collection {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }

        .nft-card .nft-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nft-card .nft-price .native {
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .nft-card .nft-price .usd {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .nft-card .chain-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .nft-card .chain-badge.cardano { background: #0033AD; color: white; }
        .nft-card .chain-badge.ethereum { background: #627EEA; color: white; }
        .nft-card .chain-badge.solana { background: #14F195; color: black; }
        .nft-card .chain-badge.polygon { background: #8247E5; color: white; }
        .nft-card .chain-badge.base { background: #0052FF; color: white; }

        .nft-card .image-container {
            position: relative;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .cache-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .cache-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: 2px solid #27ae60;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(46, 204, 113, 0.4);
            position: relative;
        }

        .cache-btn::before {
            content: '🗄️';
            margin-right: 8px;
            font-size: 1.1rem;
        }

        .cache-btn::after {
            content: '⬇';
            margin-left: 5px;
            color: #2ecc71;
            font-size: 1.2rem;
            filter: brightness(1.8);
        }

        .cache-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
        }

        .cache-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .cache-btn.caching {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .cache-progress {
            font-size: 0.95rem;
            color: var(--text-primary);
            font-weight: 500;
            min-height: 24px;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-radius: 6px;
            border-left: 3px solid var(--accent-success);
        }

        .cache-status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--bg-secondary);
            border-radius: 6px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color, #444);
        }

        .cache-status-indicator .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #95a5a6;
        }

        .cache-status-indicator.active .status-dot {
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .privacy-btn {
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color, #444);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .privacy-btn:hover {
            background: var(--bg-tertiary);
        }

        .privacy-btn.active {
            background: var(--accent-success);
            color: #000;
        }

        #privacyIcon {
            font-size: 1.1rem;
        }

        /* Privacy Mode - Blur NFT sensitive data */
        body.privacy-mode .nft-image {
            filter: blur(10px);
            user-select: none;
        }

        body.privacy-mode .nft-price,
        body.privacy-mode .nft-value,
        body.privacy-mode .nft-name,
        body.privacy-mode .nft-collection,
        body.privacy-mode .chain-tab .count,
        body.privacy-mode .chain-tab-value .value-amount {
            filter: blur(8px);
            user-select: none;
        }

        body.privacy-mode .modal-overlay {
            filter: blur(15px);
        }

        /* Modal for full-size image */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            max-width: 90vw;
            max-height: 90vh;
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
        }

        .modal-info {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 0 0 8px 8px;
            margin-top: -8px;
        }

        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .nft-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }

            .wall-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .chain-tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 10px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        // XSS Protection - Safe HTML rendering
        function setSafeHTML(element, html) {
            if (!element) return;
            if (typeof DOMPurify !== 'undefined') {
                element.innerHTML = DOMPurify.sanitize(html);
            } else {
                console.warn('DOMPurify not loaded, falling back to textContent');
                element.textContent = html;
            }
        }
    </script>
</head>
<body>

            <button class="chain-tab" data-chain="cardano" onclick="switchChain('cardano')">
                Cardano <span class="count" id="countCardano">0</span>

            <button class="chain-tab" data-chain="ethereum" onclick="switchChain('ethereum')">
                Ethereum <span class="count" id="countEthereum">0</span>
            </button>

                Solana <span class="count" id="countSolana">0</span>

    <!-- Modal for full-size image -->

    <script>
        // API_BASE is defined in app.js
        let allNfts = [];
        let currentChain = 'all';

        // Format USD value
        function formatUSD(value) {
            if (value === null || value === undefined) return '-';
            return '$' + value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Load wall status
        async function loadWallStatus() {
            try {
                const response = await authFetch(`${API_BASE}/nfts/wall/status`);
                const data = await response.json();

                const totalWithImages = data.total_with_images || 0;
                const totalCached = data.total_cached || 0;
                const uncached = totalWithImages - totalCached;

                // Update button text based on remaining images
                const btn = document.getElementById('cacheBtn');
                if (uncached > 0 && !btn.disabled) {
                    btn.textContent = `Cache ${Math.min(200, uncached)} Images`;
                } else if (uncached === 0 && !btn.disabled) {
                    btn.textContent = 'All Images Cached ✓';
                    btn.disabled = true;
                }

                // Update chain counts in status and show/hide tabs
                const byChain = data.by_chain || {};
                const allChains = ['cardano', 'ethereum', 'solana', 'polygon', 'base'];

                for (const chain of allChains) {
                    const info = byChain[chain];

                    // Show tab if chain has NFTs with images (even if not cached yet)
                    const hasNfts = info && (info.with_images > 0 || info.total_nfts > 0);
                    const cachedCount = info ? (info.cached || 0) : 0;

                    const tab = document.querySelector(`.chain-tab[data-chain="${chain}"]`);
                    const countEl = document.getElementById(`count${chain.charAt(0).toUpperCase() + chain.slice(1)}`);

                    if (countEl) countEl.textContent = cachedCount;

                    // Show/hide tabs based on whether chain has NFTs (not just cached)
                    if (tab) {
                        if (!hasNfts || (info && info.configured === false)) {
                            tab.style.display = 'none';
                        } else {
                            tab.style.display = 'flex';
                        }
                    }
                }

                // Auto-cache if no images are cached yet
                if (totalCached === 0 && totalWithImages > 0) {
                    console.log('No cached images found, starting automatic caching...');
                    document.getElementById('cacheProgress').textContent = 'Starting automatic image caching...';
                    document.getElementById('cacheProgress').style.display = 'block';
                    setTimeout(() => cacheImages(true), 1000); // Auto-cache after 1 second
                }
            } catch (error) {
                console.error('Error loading wall status:', error);
            }
        }

        // Load NFTs with images
        async function loadNfts() {
            const grid = document.getElementById('nftGrid');
            setSafeHTML(grid, `
                <div class="empty-state">
                    <h3>Loading NFTs...</h3>
                    <p>Please wait while we load your NFT collection from the backend.</p>
                    <div style="margin-top: 20px; font-size: 2rem;">⏳</div>
                </div>
            `);

            try {
                const url = currentChain === 'all'
                    ? `${API_BASE}/nfts/wall/nfts`
                    : `${API_BASE}/nfts/wall/nfts?blockchain=${currentChain}`;

                const response = await authFetch(url);
                const data = await response.json();

                allNfts = data.nfts || [];

                // Update counts
                document.getElementById('countAll').textContent = data.total_count || 0;

                const byChain = data.by_chain || {};

                // Update chain counts (but don't hide tabs - loadWallStatus() handles that)
                const allChains = ['cardano', 'ethereum', 'solana', 'polygon', 'base'];
                for (const chain of allChains) {
                    const count = byChain[chain] || 0;
                    const countEl = document.getElementById(`count${chain.charAt(0).toUpperCase() + chain.slice(1)}`);
                    if (countEl) countEl.textContent = count;
                }

                // Calculate total value
                const totalValue = allNfts.reduce((sum, nft) => sum + (nft.floor_price_usd || 0), 0);
                document.getElementById('totalValue').textContent = formatUSD(totalValue);

                renderNfts();
            } catch (error) {
                console.error('Error loading NFTs:', error);
                setSafeHTML(document.getElementById('nftGrid'), `
                    <div class="empty-state">
                        <h3>Error Loading NFTs</h3>
                        <p>${error.message}</p>
                    </div>
                `);

            }
        }

        // Render NFT grid
        function renderNfts() {
            const grid = document.getElementById('nftGrid');

            const nftsToShow = currentChain === 'all'
                ? allNfts
                : allNfts.filter(n => n.blockchain === currentChain);

            if (nftsToShow.length === 0) {
                const chainName = currentChain === 'all' ? 'any blockchain' : currentChain.charAt(0).toUpperCase() + currentChain.slice(1);
                setSafeHTML(grid, `
                    <div class="empty-state">
                        <h3>No Cached Images for ${chainName}</h3>
                        <p>You have NFTs on this blockchain, but their images haven't been cached yet.</p>
                        <p style="margin-top: 15px;">Click the <strong>"Cache Images"</strong> button above to download and display your NFT images.</p>
                    </div>
                `);

                return;
            }

            setSafeHTML(grid, nftsToShow.map(nft => `
                <div class="nft-card" onclick="openModal('${nft.asset_id}', '${nft.blockchain}')">
                    <div class="image-container">
                        <span class="chain-badge ${nft.blockchain}">${nft.blockchain}</span>
                        <img class="nft-image" src="${nft.thumbnail_url}"
                             alt="${nft.name}"
                             loading="lazy"
                             onerror="this.parentElement.innerHTML='<span class=\\'chain-badge ${nft.blockchain}\\'>${nft.blockchain}</span><div class=\\'no-image-placeholder\\'><div class=\\'nft-text\\'>NFT</div><div class=\\'no-cache-text\\'>No cached image found</div></div>';">
                    </div>
                    <div class="nft-info">
                        <div class="nft-name">${escapeHtml(nft.name)}</div>
                        <div class="nft-collection">${escapeHtml(nft.collection)}</div>
                        <div class="nft-price">
                            <span class="native nft-value">${nft.floor_price ? nft.floor_price.toFixed(2) + ' ' + nft.native_symbol : '-'}</span>
                            <span class="usd nft-value">${formatUSD(nft.floor_price_usd)}</span>
                        </div>
                    </div>
                </div>
            `).join(''));
        }

        // Escape HTML to prevent XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;');
        }

        // Switch chain tab
        function switchChain(chain) {
            currentChain = chain;

            // Update tab active state
            document.querySelectorAll('.chain-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.chain === chain);
            });

            // If switching to a specific chain, reload data for that chain only
            if (chain !== 'all') {
                loadNfts();
            } else {
                renderNfts();
            }
        }

        // Update status indicator
        function updateStatusIndicator(status, text) {
            const indicator = document.getElementById('cacheStatusIndicator');
            const statusText = indicator.querySelector('.status-text');

            if (status === 'active') {
                indicator.classList.add('active');
                statusText.textContent = text || 'Caching...';
            } else {
                indicator.classList.remove('active');
                statusText.textContent = text || 'Idle';
            }
        }

        // Cache images
        async function cacheImages(auto = false) {
            const btn = document.getElementById('cacheBtn');
            const progress = document.getElementById('cacheProgress');

            btn.disabled = true;
            btn.classList.add('caching');
            btn.textContent = 'Starting...';
            updateStatusIndicator('active', 'Caching Images');

            progress.textContent = '⏳ Starting background image caching...';
            progress.style.display = 'block';

            try {
                const chain = currentChain === 'all' ? null : currentChain;
                // Background mode enabled by default on backend
                const url = chain
                    ? `${API_BASE}/nfts/wall/cache-all?blockchain=${chain}`
                    : `${API_BASE}/nfts/wall/cache-all`;

                const response = await authFetch(url, { method: 'POST' });
                const data = await response.json();

                // Check if running in background mode
                if (data.background) {
                    progress.textContent = `✓ Image caching started in background! You can safely leave this page or continue browsing. Images will appear as they are cached. Refresh the page later to see newly cached NFTs.`;
                    progress.style.borderLeftColor = '#2ecc71';
                    updateStatusIndicator('active', 'Caching in Background');

                    btn.textContent = 'Caching in Progress...';
                    btn.disabled = true;

                    // Re-enable button after 30 seconds to allow another batch
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.textContent = 'Cache More Images';
                    }, 30000);

                } else {
                    // Synchronous mode (old behavior)
                    const skipped = data.total_skipped || 0;
                    const total = data.total_cached + data.total_failed + skipped;

                    progress.textContent = `✓ Batch complete! Newly cached: ${data.total_cached} | Failed: ${data.total_failed} | Already cached: ${skipped} (Total processed: ${total})`;
                    progress.style.borderLeftColor = '#2ecc71';

                    // Reload data
                    await loadWallStatus();
                    await loadNfts();

                    updateStatusIndicator('idle', 'Ready');

                    // If there are still uncached images, suggest running again
                    if (data.total_cached > 0 || data.total_failed > 0) {
                        setTimeout(() => {
                            const indicator = document.getElementById('cacheStatusIndicator');
                            indicator.querySelector('.status-text').textContent = 'More images available';
                        }, 1000);
                    }
                }

            } catch (error) {
                progress.textContent = '✗ Error starting cache process: ' + error.message;
                progress.style.borderLeftColor = '#dc3545';
                updateStatusIndicator('idle', 'Error');

                btn.classList.remove('caching');
                btn.disabled = false;
                btn.textContent = 'Cache Images';

                setTimeout(() => {
                    progress.style.display = 'none';
                    progress.style.borderLeftColor = 'var(--accent-success)';
                }, 8000);
            }
        }

        // Open modal with full-size image
        function openModal(assetId, blockchain) {
            const nft = allNfts.find(n => n.asset_id === assetId && n.blockchain === blockchain);
            if (!nft) return;

            document.getElementById('modalImage').src = nft.image_url;
            document.getElementById('modalName').textContent = nft.name;
            document.getElementById('modalCollection').textContent = nft.collection;
            document.getElementById('modalPrice').textContent = nft.floor_price
                ? `${nft.floor_price.toFixed(2)} ${nft.native_symbol} (${formatUSD(nft.floor_price_usd)})`
                : 'No price data';

            document.getElementById('imageModal').classList.add('active');
        }

        // Close modal
        function closeModal(event) {
            if (event && event.target !== document.getElementById('imageModal')) return;
            document.getElementById('imageModal').classList.remove('active');
        }

        // Keyboard support for modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Check background scheduler status
        async function checkBackgroundStatus() {
            try {
                const response = await authFetch(`${API_BASE}/nft-scheduler/status`);
                const data = await response.json();

                if (data.enabled && data.running) {
                    const nextRun = data.next_run ? new Date(data.next_run).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Unknown';
                    updateStatusIndicator('active', `Scheduler Active (Next: ${nextRun})`);
                } else if (data.enabled && !data.running) {
                    updateStatusIndicator('idle', 'Scheduler Enabled (Idle)');
                } else {
                    updateStatusIndicator('idle', 'Idle');
                }
            } catch (error) {
                console.error('Error checking background status:', error);
            }
        }

        // Privacy Mode Functions
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializePrivacyMode();
            loadSavedTheme();
            loadWallStatus();
            loadNfts();
            checkBackgroundStatus();

            // Check background status every 30 seconds
            setInterval(checkBackgroundStatus, 30000);
        });
    </script>

        <p>ABCT - NFT Gallery | <span style="opacity: 0.6;">v0.13.1 (BUILD 1769826090)</span></p>
    </footer>
</body>
