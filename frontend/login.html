<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABCT Login</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/css/styles.css?v=1770088895">
    <style>
        /* Login-specific styles */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a1a;
            padding: 20px;
        }

        .login-card {
            background: #000000;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header img {
            max-width: 280px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .login-header h1 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #cccccc;
            font-size: 14px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            background: #000000;
            border: 2px solid #ffffff;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            padding: 12px 16px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .form-group input:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 255, 255, 0.4);
        }

        .form-group input::placeholder {
            color: #888888;
            opacity: 0.8;
        }

        .login-btn {
            background: #f59e0b;
            color: #000000;
            border: none;
            border-radius: 6px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .login-btn:hover {
            background: #d97706;
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.6);
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 6px;
            color: #ff6b6b;
            padding: 12px 16px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .login-footer p {
            color: #cccccc;
            font-size: 13px;
            line-height: 1.6;
        }

        .login-footer code {
            background: #222222;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #ffffff;
        }

        /* Loading spinner */
        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #000000;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-left: 10px;
            vertical-align: middle;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-btn .spinner {
            display: none;
        }

        .login-btn.loading .spinner {
            display: inline-block;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <script>
        // XSS Protection - Safe HTML rendering
        function setSafeHTML(element, html) {
            if (!element) return;
            if (typeof DOMPurify !== 'undefined') {
                element.innerHTML = DOMPurify.sanitize(html);
            } else {
                console.warn('DOMPurify not loaded, falling back to textContent');
                element.textContent = html;
            }
        }
    </script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="/static/abct-logo2.png" alt="ABCT - A Better Crypto Tracker">
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Login
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="login-footer">
                <p>
                    <strong>Default credentials:</strong><br>
                    Username: <code>admin</code><br>
                    Password: <code>satoshi</code>
                </p>
                <p style="margin-top: 12px; font-size: 11px;">
                    For security, use a strong password
                </p>
                <div style="margin-top: 20px; padding: 12px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 8px;">
                    <p style="margin: 0; color: #f59e0b; font-size: 13px;">
                        <span style="font-size: 16px;">🎭</span> <strong>Try Demo Mode:</strong><br>
                        Username: <code style="background: rgba(245, 158, 11, 0.2); color: #f59e0b;">demo</code><br>
                        Password: <code style="background: rgba(245, 158, 11, 0.2); color: #f59e0b;">demo</code>
                    </p>
                    <p style="margin: 8px 0 0 0; font-size: 11px; color: #d97706;">
                        View simulated portfolio data
                    </p>
                </div>
            </div>
        </div>

        <!-- Version footer (bottom right) -->
        <div style="position: fixed; bottom: 10px; right: 10px; color: var(--text-secondary); font-size: 11px; opacity: 0.6;">
            Build <span id="versionNumber"></span>
        </div>
    </div>

    <script>
        // Build version
        const BUILD_VERSION = 'v1.0.1 (BUILD 1770000515)';

        // Theme handling
        function initTheme() {
            const savedTheme = localStorage.getItem('abct_theme') || 'default';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        // Initialize theme on page load
        initTheme();

        // Display build version
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('versionNumber').textContent = BUILD_VERSION;
        });

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');

            // Auto-hide after 5 seconds
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        // Hide error message
        function hideError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');
        }

        // Handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            hideError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            // Show loading state
            loginBtn.disabled = true;
            loginBtn.classList.add('loading');
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success && data.token) {
                    // Store token in localStorage
                    localStorage.setItem('abct_token', data.token);
                    localStorage.setItem('abct_username', username);

                    // Check if this is demo account
                    if (username.toLowerCase() === 'demo') {
                        localStorage.setItem('is_demo', 'true');
                    } else {
                        localStorage.removeItem('is_demo');
                    }

                    // Redirect to dashboard
                    window.location.href = '/';
                } else {
                    showError(data.message || 'Login failed. Please check your credentials.');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Connection error. Please check if the server is running.');
            } finally {
                // Reset button state
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
                loginBtn.textContent = 'Login';
            }
        });

        // Auto-fill default credentials on Ctrl+D (for development)
        // Auto-fill demo credentials on Ctrl+Shift+D
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key === 'D') {
                e.preventDefault();
                document.getElementById('username').value = 'demo';
                document.getElementById('password').value = 'demo';
            } else if (e.ctrlKey && e.key === 'd') {
                e.preventDefault();
                document.getElementById('username').value = 'admin';
                document.getElementById('password').value = 'satoshi';
            }
        });

        // Clear any existing token on page load (in case user was logged out)
        if (window.location.search.includes('logout=1')) {
            localStorage.removeItem('abct_token');
            localStorage.removeItem('abct_username');
            localStorage.removeItem('is_demo');
        }
    </script>
</body>
</html>
