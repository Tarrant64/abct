# ABCT Dashboard - Nginx Configuration
# Serves static frontend and proxies API requests to FastAPI backend

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Security headers (Finding #8)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow larger file uploads (for backup restore, NFT uploads, etc.)
    client_max_body_size 100M;

    # Frontend - static files
    root /app/frontend;
    index index.html;

    # Serve /static/ paths - maps to /app/frontend/
    # CSS at /static/css/styles.css -> /app/frontend/css/styles.css
    # Use ^~ for preferential prefix match (beats regex matches)
    location ^~ /static/css/ {
        alias /app/frontend/css/;
        types { text/css css; }
        default_type text/css;
    }

    location ^~ /static/js/ {
        alias /app/frontend/js/;
        types { application/javascript js; }
        default_type application/javascript;
    }

    location ^~ /static/ {
        alias /app/frontend/;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # API requests - proxy to FastAPI backend
    location /api/ {
        # Keep /api prefix when proxying (backend expects it)
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future use)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # OpenAPI spec - proxy to FastAPI (needed for API Reference page)
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Direct API access (without /api prefix) - for backwards compatibility
    location ~ ^/(wallets|portfolio|defi|nfts|exchanges|prices|custom-tokens|settings|security|health|images|logs|nft-scheduler|backup|auth|cloudflare|transactions|spam|nmkr|balance-history|analytics|engine|intelligence|cache|search|pnl|privacy)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # V2 Frontend at /next/*
    # Static assets served directly by nginx for performance
    location ^~ /next/static/css/ {
        alias /app/frontend/v2/css/;
        types { text/css css; }
        default_type text/css;
    }

    location ^~ /next/static/js/ {
        alias /app/frontend/v2/js/;
        types { application/javascript js; }
        default_type application/javascript;
    }

    location ^~ /next/static/ {
        alias /app/frontend/v2/;
    }

    # V2 page routes - proxy to FastAPI for HTML serving
    location /next {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # V1 static files - try file, then directory, then V1 index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for HTML (always get fresh)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
