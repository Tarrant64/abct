services:
  abct-dashboard:
    build:
      context: ..
      dockerfile: abct-docker/Dockerfile
    container_name: abct-dashboard
    restart: unless-stopped
    networks:
      abct_net:
        ipv4_address: ${ABCT_STATIC_IP:-}
    volumes:
      # Persist SQLite database
      - abct-data:/app/data
    labels:
      - "org.opencontainers.image.title=ABCT - A Better Crypto Tracker"
      - "org.opencontainers.image.description=Multi-chain cryptocurrency portfolio tracker"
      - "org.opencontainers.image.url=https://github.com/Tarrant64/abct"
      - "org.opencontainers.image.source=https://github.com/Tarrant64/abct"
      - "org.opencontainers.image.documentation=https://github.com/Tarrant64/abct/blob/main/README.md"
    environment:
      # Required API keys
      - BLOCKFROST_API_KEY=${BLOCKFROST_API_KEY:-}

      # Optional API keys
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}

      # Optional: External NFT price service
      - NFT_PRICE_SERVICE_URL=${NFT_PRICE_SERVICE_URL:-}

      # Database path (inside container)
      - DATABASE_PATH=/app/data/portfolio.db

      # Authentication (set to false to disable login requirement)
      - ABCT_REQUIRE_AUTH=${ABCT_REQUIRE_AUTH:-true}
      - ABCT_ADMIN_USER=${ABCT_ADMIN_USER:-}
      - ABCT_ADMIN_PASSWORD=${ABCT_ADMIN_PASSWORD:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  abct_net:
    external: true
    name: ${ABCT_DOCKER_NETWORK:-br0}

volumes:
  abct-data:
    driver: local
