name: Docker Scout Security Scan

on:
  pull_request:
    paths:
      - 'abct-docker/**'
      - 'backend/requirements.txt'
      - 'backend/requirements-security.txt'
  schedule:
    - cron: '0 9 * * 1'  # Monday 9 AM UTC
  workflow_dispatch:

env:
  IMAGE_NAME: tarrant64/abct

jobs:
  pr-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build local image for comparison
        uses: docker/build-push-action@v5
        with:
          context: .
          file: abct-docker/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
          cache-from: type=gha

      - name: Compare against latest
        uses: docker/scout-action@v1
        with:
          command: compare
          image: local://${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
          to: registry://tarrant64/abct:latest
          only-severities: critical,high
          only-fixed: true
          ignore-unchanged: true
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  weekly-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Docker Scout CLI
        run: curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o install-scout.sh && sh install-scout.sh

      - name: Run CVE scan
        id: cve-scan
        run: |
          docker scout cves registry://tarrant64/abct:latest \
            --only-severities critical,high \
            --only-fixed \
            --format markdown > /tmp/cve-report.md 2>&1 || true

          # Count unique CVE identifiers
          CVE_COUNT=$(grep -oP 'CVE-\d{4}-\d+' /tmp/cve-report.md | sort -u | wc -l | xargs)
          echo "cve_count=$CVE_COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $CVE_COUNT fixable critical/high CVE(s)"

      - name: Run recommendations
        if: steps.cve-scan.outputs.cve_count != '0'
        run: |
          docker scout recommendations registry://tarrant64/abct:latest \
            --format markdown > /tmp/reco-report.md 2>&1 || true

      - name: Add to job summary
        run: |
          echo "## Docker Scout Weekly Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`tarrant64/abct:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Fixable critical/high CVEs:** ${{ steps.cve-scan.outputs.cve_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### CVE Report" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cve-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/reco-report.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Base Image Recommendations" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/reco-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create issue if CVEs found
        if: steps.cve-scan.outputs.cve_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CVE_COUNT="${{ steps.cve-scan.outputs.cve_count }}"
          DATE=$(date -u +"%Y-%m-%d")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Build issue body from scan output files
          {
            echo "## Docker Scout Weekly Scan — ${DATE}"
            echo ""
            echo "**Image:** \`tarrant64/abct:latest\`"
            echo "**Fixable critical/high CVEs found:** ${CVE_COUNT}"
            echo ""
            echo "### CVE Report"
            cat /tmp/cve-report.md
            echo ""
            if [ -f /tmp/reco-report.md ]; then
              echo "### Base Image Recommendations"
              cat /tmp/reco-report.md
              echo ""
            fi
            echo "---"
            echo "*Auto-created by [Docker Scout weekly scan](${RUN_URL}).*"
          } > /tmp/issue-body.md

          gh issue create \
            --title "Docker Scout: ${CVE_COUNT} critical/high CVEs found in latest image (${DATE})" \
            --label "security,docker" \
            --body-file /tmp/issue-body.md
