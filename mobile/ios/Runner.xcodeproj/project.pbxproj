			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Build & Embed watchOS companion app\n# Skip for simulators — only embed for device builds\nif [ \"${PLATFORM_NAME}\" = \"iphonesimulator\" ]; then\n  echo \"Skipping watch app embed for simulator build\"\n  exit 0\nfi\n\n# Save vars we need before unsetting inherited env\nSAVED_BUILD_DIR=\"${BUILD_DIR}\"\nSAVED_CONFIGURATION=\"${CONFIGURATION}\"\nSAVED_PROJECT=\"${PROJECT_FILE_PATH}\"\nSAVED_BUILT_PRODUCTS=\"${BUILT_PRODUCTS_DIR}\"\nSAVED_CONTENTS_FOLDER=\"${CONTENTS_FOLDER_PATH}\"\nSAVED_DEV_TEAM=\"${DEVELOPMENT_TEAM}\"\nSAVED_VERSION=\"${FLUTTER_BUILD_NAME:-${MARKETING_VERSION}}\"\nSAVED_BUILD_NUM=\"${FLUTTER_BUILD_NUMBER:-${CURRENT_PROJECT_VERSION}}\"\n\nWATCH_TARGET=\"ABCT-watchosapp Watch App\"\nWATCH_BUILT_APP=\"${SAVED_BUILD_DIR}/${SAVED_CONFIGURATION}-watchos/ABCT-watchosapp Watch App.app\"\nEMBED_DIR=\"${SAVED_BUILT_PRODUCTS}/${SAVED_CONTENTS_FOLDER}/Watch\"\n\necho \"Building watch app with -target/-sdk watchos...\"\necho \"Version: ${SAVED_VERSION} Build: ${SAVED_BUILD_NUM}\"\n\n# Unset inherited iOS SDK vars that conflict with watchOS build\nunset SDKROOT\nunset PLATFORM_NAME\nunset EFFECTIVE_PLATFORM_NAME\nunset CORRESPONDING_SIMULATOR_PLATFORM_NAME\nunset CURRENT_ARCH\nunset ARCHS\nunset VALID_ARCHS\nunset TARGETED_DEVICE_FAMILY\nunset IPHONEOS_DEPLOYMENT_TARGET\n\nxcodebuild build \\\n  -project \"${SAVED_PROJECT}\" \\\n  -target \"${WATCH_TARGET}\" \\\n  -sdk watchos \\\n  -configuration \"${SAVED_CONFIGURATION}\" \\\n  -allowProvisioningUpdates \\\n  BUILD_DIR=\"${SAVED_BUILD_DIR}\" \\\n  DEVELOPMENT_TEAM=\"${SAVED_DEV_TEAM}\" \\\n  MARKETING_VERSION=\"${SAVED_VERSION}\" \\\n  CURRENT_PROJECT_VERSION=\"${SAVED_BUILD_NUM}\" \\\n  OTHER_CODE_SIGN_FLAGS=\"--timestamp=none\" \\\n  2>&1 | tail -30\n\necho \"Inner xcodebuild exit: ${PIPESTATUS[0]}\"\n\nif [ -d \"${WATCH_BUILT_APP}\" ]; then\n  echo \"Embedding watch app into ${EMBED_DIR}\"\n  mkdir -p \"${EMBED_DIR}\"\n  cp -R \"${WATCH_BUILT_APP}\" \"${EMBED_DIR}/\"\n  echo \"Watch app embedded successfully\"\nelse\n  echo \"warning: Watch app not found at ${WATCH_BUILT_APP}\"\n  ls -la \"${SAVED_BUILD_DIR}/\" 2>/dev/null || true\n  ls -la \"${SAVED_BUILD_DIR}/${SAVED_CONFIGURATION}-watchos/\" 2>/dev/null || true\nfi\n";
		};
