    how_to_check:\
      - "Search for: innerHTML=, insertAdjacentHTML, document.write in frontend/**/*.js and frontend/**/*.html."\
      - "For each sink, trace data origin: API responses, URL params, localStorage, DOM."\
      - "Require textContent or DOM node creation for all untrusted strings."\
    pass_criteria:\
      - "No untrusted string flows into innerHTML; sanitized allowlist sanitizer used if HTML rendering is unavoidable."\
    mappings:\
      nist: ["SI-10 (Information Input Validation)"]\
      iso_27034: ["Output encoding & input validation as app security controls"]\
      cwe: ["CWE-79 (XSS)", "CWE-116 (Improper Encoding or Escaping)"]\
      cis_1_6: ["CIS 4 (Secure Configuration)"]\
      cert: ["CERT: Output Encoding, Validate Input, Avoid dangerous HTML APIs"]\
\
  - id: "ABCT-OWASP-A03-002"\
    title: "Validate and sanitize any HTML generated server-side (microservice status page)"\
    category: "OWASP A03: Injection"\
    why: "Microservice builds HTML with f-strings and returns it; any future untrusted interpolation could become XSS."\
    repo_evidence:\
