      - "Confirm interpolated values are strictly typed (numbers/dates) or escaped."\
    pass_criteria:\
      - "No unescaped untrusted strings interpolated into HTML."\
    mappings:\
      nist: ["SI-10"]\
      iso_27034: ["Secure output handling control"]\
      cwe: ["CWE-79", "CWE-116"]\
      cis_1_6: ["CIS 4"]\
      cert: ["CERT: Encode output, avoid mixed data/markup"]\
\
  # ---------------------------------------------------------------------------\
