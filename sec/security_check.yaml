  # ---------------------------------------------------------------------------\
  # OWASP A01 Broken Access Control\
  # ---------------------------------------------------------------------------\
  - id: "ABCT-OWASP-A01-001"\
    title: "Enforce authentication/authorization for all state-changing endpoints"\
    category: "OWASP A01: Broken Access Control"\
    why: "Routers are included without a visible global auth gate; security endpoints include certificate upload and SSL mode changes."\
    repo_evidence:\
      - "backend/main.py includes security router" # :contentReference[oaicite:13]\{index=13\}\
      - "security router exposes /security/settings and /security/certificate/upload" # :contentReference[oaicite:14]\{index=14\}\
    how_to_check:\
      - "Enumerate all POST/PUT/PATCH/DELETE routes in backend/routers/*."\
      - "Verify each requires (a) auth OR (b) explicit localhost-only enforcement OR (c) both."\
    pass_criteria:\
      - "All state-changing endpoints require auth or explicit local-only guard; /security/* must be protected."\
    mappings:\
      nist:\
        - "NIST 800-53: AC-3, AC-6"\
        - "NIST SSDF (800-218): PW.4, RV.1"\
      iso_27034:\
        - "Application security requirements & controls defined and enforced at runtime"\
      cwe:\
        - "CWE-306 (Missing Authentication)"\
        - "CWE-285 (Improper Authorization)"\
      cis_1_6:\
        - "CIS 5 (Account Management)"\
        - "CIS 6 (Access Control Management)"\
      cert:\
        - "CERT: Authenticate users, authorize actions; least privilege"\
\
  - id: "ABCT-OWASP-A01-002"\
    title: "Protect certificate/key management endpoints with strongest controls"\
    category: "OWASP A01: Broken Access Control"\
    why: "Private key upload exists and is high impact."\
    repo_evidence:\
      - "Certificate upload endpoint writes uploaded cert/key and chmod 600" # :contentReference[oaicite:15]\{index=15\}\
    how_to_check:\
      - "Confirm /security/certificate/upload, /security/certificate/generate, /security/settings, /security/certificate DELETE cannot be called by unauthenticated remote users."\
      - "Confirm request size limits and throttling exist (see A05-002)."\
    pass_criteria:\
      - "Endpoints are localhost-only AND authenticated (recommended), or otherwise strongly protected."\
    mappings:\
      nist: ["AC-3", "SC-12", "SC-13"]\
      iso_27034: ["Protection of sensitive assets in application components"]\
      cwe: ["CWE-306", "CWE-269 (Improper Privilege Management)"]\
      cis_1_6: ["CIS 6"]\
      cert: ["CERT: handle sensitive data with strict access control"]\
\
  # ---------------------------------------------------------------------------\
  # OWASP A03 Injection (incl. XSS)\
  # ---------------------------------------------------------------------------\
  - id: "ABCT-OWASP-A03-001"\
    title: "Eliminate DOM XSS sinks (innerHTML) for any API-derived values"\
    category: "OWASP A03: Injection"\
    why: "frontend uses innerHTML assignments which become XSS sinks if any value becomes attacker-controlled."\
